gy0:{src:['gy0-internet-szolgaltatasok.html'],lead:'A böngésző a legtöbbet használt hálózati program, és rengeteget tud rólunk. Mit tárol, mit árul el, és hogyan védekezzünk?',
sections:[
{h:'Böngészők és bővítmények',html:`<ul><li>Edge, Chrome, Firefox, Opera, Safari. Az első PC-s böngésző a Mosaic (1993).<\/li>
<li>Az ingyenes böngészők bevétele a keresőkből és az adatgyűjtésből (célzott hirdetések) jön. A szinkronizáció a profilozást minden eszközre kiterjeszti.<\/li>
<li>A <b>bővítmény<\/b> lehet rosszindulatú: olvasd el a párbeszédablakot, és rendszeresen töröld a feleslegeseket.<\/li>
<li>Frissítést csak a gyártó oldaláról vagy az OS frissítőjéből telepíts.<\/li><\/ul>`},
{h:'Mit árul el rólunk a böngésző?',html:`<ul><li><b>Címsor-kiegészítés, könyvjelzők<\/b>: kiderül, hol jártunk (pl. melyik bankot használjuk).<\/li>
<li><b>Jelszavak<\/b>: titkosított tárolóban, mesterjelszóval. Őrizetlen gépet zárolj! A böngésző szólhat a kiszivárgott jelszavakról (haveIBeenPwned).<\/li>
<li><b>Cookie<\/b>: bejelentkezés, beállítások, kosár. Átmásolva más gépen is működhet, akár bejelentkezett állapottal.<\/li>
<li><b>Szinkronizálás<\/b>: előzmények, jelszavak, fizetési adatok. Idegen gépen bejelentkezni súlyos kockázat.<\/li>
<li><b>Cache<\/b> és Letöltések mappa: a rendszergazda láthatja, mit töltöttünk le.<\/li><\/ul>`},
{h:'Privát mód, proxy, darknet',html:`<ul><li>A <b>privát mód<\/b> csak helyben nem ment. A munkahely, a szolgáltató és a DNS üzemeltetője továbbra is látja a forgalmat.<\/li>
<li>A <b>proxy<\/b> közös gyorsítótár, de üzemeltetője részletes statisztikát készíthet.<\/li>
<li>A <b>darknet<\/b> (.onion címek, Tor böngésző) a forgalmat több csomóponton át, titkosítva viszi. A használata a forgalomból kimutatható, ezért gyakran VPN-nel kombinálják.<\/li><\/ul>`},
{anim:'dns',why:'Miért látja a DNS üzemeltetője privát módban is, hova mentünk?'}
]},
gyios:{src:['gy1-cisco-startup.html','gy2-packet-tracer.html','gy3-cisco-basic-setup.html','gy4-hozzaferesek-jelszavak.html'],lead:'Az első Cisco-gyakorlatok: konzolos belépés, IOS-módok, alapbeállítás, mentés, jelszavak és SSH.',
sections:[
{h:'Konzol és Packet Tracer',html:`<ul><li>A hálózati eszköznek nincs monitora: az első beállítás a <b>konzol porton<\/b> megy, konzolkábellel (Ciscón kék) és terminálprogrammal (PuTTY, Tera Term).<\/li>
<li>Paraméterek: <b>9600 bit/s, 8 adatbit, nincs paritás, 1 stopbit, nincs flow control<\/b>. macOS-en: <code>screen /dev/tty.usbserial-… 9600<\/code>.<\/li>
<li>Az <b>IOS<\/b> boot közben a RAM-ba töltődik. A futó beállítás is a RAM-ban van, ezért menteni kell.<\/li>
<li>A konzolos jelszó a jelszó-visszaállítással megkerülhető, ezért az eszközt zárt rackben kell tartani.<\/li>
<li>A <b>Packet Tracer<\/b> virtuális labor: eszközök, kábelek (konzol, egyenes), Realtime és Simulation mód; a tesztfájlok a Completion sorban értékelnek.<\/li><\/ul>`},
{h:'IOS-módok',html:`<table class="lt"><thead><tr><th>Prompt<\/th><th>Mód<\/th><th>Belépés<\/th><th>Mire jó<\/th><\/tr><\/thead><tbody>
<tr><td><code>Switch&gt;<\/code><\/td><td>user<\/td><td>alapból<\/td><td>állapot, ping<\/td><\/tr>
<tr><td><code>Switch#<\/code><\/td><td>privilegizált<\/td><td><code>enable<\/code><\/td><td>show, mentés, <code>reload<\/code><\/td><\/tr>
<tr><td><code>Switch(config)#<\/code><\/td><td>globális konfig<\/td><td><code>configure terminal<\/code><\/td><td>beállítások<\/td><\/tr>
<tr><td><code>Switch(config-if)#<\/code><\/td><td>interfész<\/td><td><code>interface …<\/code><\/td><td>port beállítása<\/td><\/tr><\/tbody><\/table>
<p><code>exit<\/code> egy szinttel vissza, <code>end<\/code> rögtön a # módba. A parancsok rövidíthetők (<code>conf t<\/code>, <code>sh int br<\/code>), a Tab kiegészít.<\/p>`},
{h:'Alapbeállítás és ellenőrzés',html:`<pre class="out">Switch# configure terminal
Switch(config)# hostname S1
S1(config)# interface vlan1
S1(config-if)# ip address 192.168.1.1 255.255.255.0
S1(config-if)# no shutdown
S1(config-if)# end
S1# show ip interface brief
S1# show interface FastEthernet0/1<\/pre>
<ul><li>A <code>show ip interface brief<\/code> oszlopai: Interface, IP-Address, OK?, Method, <b>Status<\/b>, <b>Protocol<\/b>. Az „administratively down” azt jelenti, hogy ki van kapcsolva (<code>shutdown<\/code>).<\/li>
<li>Jelölés: <code>FastEthernet0/1<\/code> = 0. slot, 1. port; rövidítve <code>F0/1<\/code>.<\/li>
<li>Az első ping gyakran <i>Request timed out<\/i>: közben fut az ARP.<\/li><\/ul>`},
{h:'Mentés és konfigurációs fájlok',html:`<pre class="out">S1# copy running-config startup-config     (RAM → NVRAM)
S1# copy running-config tftp:              (biztonsági mentés)
S1# show running-config | section Vlan1
S1# show startup-config
S1# erase startup-config                   (gyári állapot reload után)
S1# reload<\/pre>
<p>Szűrők a <code>|<\/code> után: include, begin, exclude, section. Tárhely: <code>dir flash:<\/code> (IOS), <code>dir nvram:<\/code> (startup-config).<\/p>
<p class="tip">Elfelejtett jelszó: switchen Mode gomb + <code>rename flash:config.text flash:config.old<\/code>; routeren rommon, <code>confreg 0x2142<\/code>, majd vissza <code>0x2102<\/code>.<\/p>`},
{h:'Jelszavak',html:`<ul><li><b>enable password<\/b>: olvashatóan tárolódik. <b>enable secret<\/b>: hash-elve, és elsőbbséget élvez.<\/li>
<li><code>service password-encryption<\/code>: minden jelszót <b>type 7<\/b> formára alakít, ez gyengén titkosított, visszafejthető.<\/li>
<li>Ha nincs enable jelszó, Telnetről nem lehet # módba lépni („% No password set”).<\/li><\/ul>`},
{h:'Telnet helyett SSH',html:`<ul><li>A Telnet <b>nem titkosít<\/b>: a lehallgatott forgalomból kiolvasható a jelszó. Csak védett hálózatban.<\/li>
<li>Az SSH titkosított. A beállítás:<\/li><\/ul>
<pre class="out">username admin
ip domain-name uni-eszterhazy.hu
crypto key generate rsa
ip ssh version 2
line vty 0 15
 transport input ssh
 login<\/pre>
<p class="warn"><b>A jegyzetben eltér:<\/b> a példa 512 bites kulcsot generál; SSH v2-höz legalább 768, a gyakorlatban 2048 bit kell.<\/p>`},
{anim:'telnet',why:'A támadó szemével: ugyanaz a belépés Telnettel és SSH-val.'}
]},
gy5:{src:['gy5-vlans.html'],lead:'Egy switch, több elzárt hálózat: a VLAN-okkal portonként döntjük el, ki kivel beszélhet. A trunk viszi át a VLAN-okat a switchek között.',
sections:[
{h:'VLAN létrehozása és portok',html:`<pre class="out">S1(config)# vlan 10
S1(config-vlan)# name PUBLIC
S1(config)# vlan 20
S1(config-vlan)# name OFFICES
S1(config)# interface fa0/5
S1(config-if)# switchport mode access
S1(config-if)# switchport access vlan 20
S1# show vlan brief<\/pre>
<ul><li>A jegyzet példája: VLAN 10 (PUBLIC) fa0/1–2, VLAN 20 (OFFICES) fa0/5. Minden gép a 192.168.1.0/24-ben van.<\/li>
<li>Azonos VLAN-on belül megy a ping, a két VLAN között nem, hiába azonos az IP-hálózat.<\/li><\/ul>`},
{h:'Trunk',html:`<ul><li>Két switch között minden VLAN-hoz külön kábel pazarló. A <b>trunk<\/b> egy kábelen visz több VLAN-t, a keretekbe a VLAN-azonosító kerül (802.1Q).<\/li><\/ul>
<pre class="out">S1(config)# interface g0/1
S1(config-if)# switchport mode trunk<\/pre>
<p>A jegyzet példájában 192.168.1.10 eléri a .12-t (VLAN 10), a .11 a .13-at (VLAN 20), a két switchen át.<\/p>`},
{anim:'vlan',why:'Broadcast VLAN-on belül, címke a trunkon, és miért nem megy át a ping a VLAN-ok között.'},
{h:'Biztonság: parkoló VLAN',html:`<pre class="out">S1(config)# interface range fa0/2-24
S1(config-if-range)# switchport access vlan 100
S1(config-if-range)# shutdown<\/pre>
<p>A nem használt portok egy külön, <b>100-as PARK<\/b> VLAN-ba kerülnek, és le vannak kapcsolva, így egy bedugott idegen gép sem jut az éles hálózatba.<\/p>`}
]},
gy6:{src:['gy6-ip-utvalasztas.html'],lead:'Routereket kötünk össze: interfészcímek, átjáró a gépeken, statikus és alapértelmezett útvonalak, oda és vissza.',
sections:[
{h:'Egy router, két hálózat',html:`<pre class="out">Router(config)# no ip domain-lookup
Router(config)# hostname R1
R1(config)# interface g0/0
R1(config-if)# ip address 192.168.1.1 255.255.255.0
R1(config-if)# no shutdown
R1(config)# interface g0/1
R1(config-if)# ip address 192.168.2.1 255.255.255.0
R1(config-if)# no shutdown
R1# show ip interface brief
R1# show ip route<\/pre>
<ul><li>A routing táblában <b>C<\/b> = közvetlenül csatlakozó hálózat, <b>L<\/b> = a router saját címe (/32).<\/li>
<li>A PC-ken be kell állítani az <b>alapértelmezett átjárót<\/b> (192.168.1.1, illetve 192.168.2.1), különben a másik hálózatba nem jut ki a csomag.<\/li><\/ul>`},
{h:'Két router: statikus útvonal',html:`<p>R1: 192.168.100.1/24 és 10.0.0.1/24; R2: 192.168.200.1/24 és 10.0.0.2/24. A 10.0.0.0/24 köti össze őket.<\/p>
<pre class="out">R1(config)# ip route 192.168.200.0 255.255.255.0 10.0.0.2
R2(config)# ip route 192.168.100.0 255.255.255.0 10.0.0.1<\/pre>
<ul><li>Szintaxis: <code>ip route &lt;célhálózat&gt; &lt;maszk&gt; &lt;next-hop&gt;<\/code>. A táblában <b>S<\/b> jelű sor lesz belőle.<\/li>
<li>Útvonal nélkül a router „Destination host unreachable” üzenettel válaszol.<\/li><\/ul>`},
{h:'Alapértelmezett útvonal és visszaút',html:`<pre class="out">R1(config)# ip route 0.0.0.0 0.0.0.0 172.16.8.1
R2(config)# no ip route 192.168.100.0 255.255.255.0 10.0.0.1
R2(config)# ip route 0.0.0.0 0.0.0.0 10.0.0.1
ISP(config)# ip route 192.168.100.0 255.255.255.0 172.16.8.2
ISP(config)# ip route 192.168.200.0 255.255.255.0 172.16.8.2<\/pre>
<ul><li>A <code>0.0.0.0/0<\/code> minden címre illeszkedik: ami máshova nem illik, az erre megy (<b>S*<\/b>, „Gateway of last resort”).<\/li>
<li><b>Tanulság:<\/b> az útnak oda és vissza is működnie kell. Ha az ISP nem tudja, hol a belső hálózat, a válasz elvész.<\/li><\/ul>
<p class="warn"><b>A jegyzetben eltér:<\/b> a next-hop ott 172.168.8.1, helyesen 172.16.8.1.<\/p>`},
{anim:'routing',why:'A fenti R2 táblája: írj be célcímet, és nézd meg, melyik sor nyer.'},
{h:'Mit árul el a ping?',html:`<ul><li>Az első csomag gyakran elvész (<code>.!!!!<\/code>): közben az ARP kideríti a következő ugrás MAC-címét.<\/li>
<li>A <b>TTL<\/b>-ből a routerek száma: Windows 128-cal indít, ha 126 érkezik, 2 routeren ment át.<\/li><\/ul>`},
{anim:'trace',why:'A TTL csökkenése routerenként.'}
]},
gy7:{src:['gy7-ip-gyakorlatok.html'],lead:'A vizsga egyik biztos feladata: adott IP-cím és maszk mellett hálózati cím, broadcast, kiosztható tartomány, alhálózatok száma.',
sections:[
{h:'A módszer',html:`<ol class="steps">
<li>Írd fel a maszkot binárisan: <code>/n<\/code> = n darab 1-es bit elöl.<\/li>
<li><b>Hálózati cím<\/b> = IP <b>ÉS<\/b> maszk (bitenként).<\/li>
<li><b>Broadcast<\/b> = hálózati cím <b>VAGY<\/b> a maszk inverze (a host-bitek mind 1).<\/li>
<li>Kiosztható tartomány: hálózati cím + 1 … broadcast − 1. Az átjáró általában az első vagy az utolsó.<\/li>
<li>Hosztok száma: 2<sup>32−n<\/sup> − 2.<\/li>
<li>Alhálózatok száma egy nagyobb hálózatban: 2<sup>(új prefix − régi prefix)<\/sup>.<\/li><\/ol>
<p class="tip"><b>Gyors fejszámolás:<\/b> a „törött” byte-ban a blokkméret 256 − maszkbyte (pl. /26 → 256−192 = 64). A hálózati cím a cím alatti legnagyobb 64-gyel osztható szám.<\/p>`},
{h:'Kidolgozott példák a jegyzetből',html:`<table class="lt"><thead><tr><th>Cím<\/th><th>Hálózat<\/th><th>Broadcast<\/th><th>Tartomány<\/th><th>Alháló /24-ben<\/th><\/tr><\/thead><tbody>
<tr><td>192.100.65.142/25<\/td><td>192.100.65.128<\/td><td>192.100.65.255<\/td><td>.129 – .254<\/td><td>2<\/td><\/tr>
<tr><td>211.157.32.44/26<\/td><td>211.157.32.0<\/td><td>211.157.32.63<\/td><td>.1 – .62<\/td><td>4<\/td><\/tr>
<tr><td>208.31.180.89/30<\/td><td>208.31.180.88<\/td><td>208.31.180.91<\/td><td>.89 – .90 (2 gép)<\/td><td>64<\/td><\/tr><\/tbody><\/table>
<ul><li>Gyakori hiba: a broadcast nem „hálózati cím + 1”. A /30-ban csak 2 gép fér el (pont-pont routerkapcsolatokra).<\/li>
<li>Ellenőrzésre: <code>ipcalc<\/code>, vagy a lenti számoló.<\/li><\/ul>`},
{anim:'subnet',why:'Számoló bitenkénti nézettel, és végtelen gyakorló feladat azonnali ellenőrzéssel.'}
]},
gy9:{src:['gy9-dhcp.html','e5-dhcp.html'],lead:'A routert DHCP szerverré tesszük, majd egy másik hálózat gépeit is kiszolgáljuk relayen át.',
sections:[
{h:'Router mint DHCP szerver',html:`<pre class="out">R1(config)# ip dhcp excluded-address 192.168.100.1 192.168.100.10
R1(config)# ip dhcp pool LEFT
R1(dhcp-config)# network 192.168.100.0 255.255.255.0
R1(dhcp-config)# default-router 192.168.100.1
R1# show ip dhcp binding<\/pre>
<ul><li>Az <b>excluded-address<\/b> tartományt nem osztja ki (szervereknek, hálózati eszközöknek). Ezért kapnak a kliensek .11-től címet.<\/li>
<li>A <code>show ip dhcp binding<\/code> megmutatja, melyik MAC-cím melyik IP-t kapta.<\/li><\/ul>`},
{anim:'dhcp',why:'A DORA folyamat és a DHCP elleni támadások.'},
{h:'DHCP relay',html:`<ul><li>R1 a szerver (pool LEFT a 192.168.100.0/24-nek, RIGHT a 192.168.200.0/24-nek). R2 mögött van a 192.168.200.0/24; a két router között 192.168.50.0/29.<\/li>
<li>Gond: a kliens <b>broadcastot<\/b> küld, és a router nem továbbítja a broadcastot másik hálózatba.<\/li>
<li>Megoldás: R2-n a <b>kliensek felé néző<\/b> interfészen:<\/li><\/ul>
<pre class="out">R2(config)# interface g0/0
R2(config-if)# ip helper-address 192.168.50.1<\/pre>
<p>R2 a kérést <b>unicastként<\/b> továbbítja a szervernek, és visszajuttatja a választ. A kliens <code>ipconfig /all<\/code> kimenetében a DHCP Server = 192.168.50.1, más hálózatban: ebből látszik, hogy relay segített.<\/p>`},
{anim:'relay',why:'A broadcast elakad, majd az ip helper-address átviszi.'}
]},
gy10:{src:['gy10-wifi.html'],lead:'Vezeték nélküli hálózat beállítása: titkosítás, azonosítás, és vállalati környezetben külső RADIUS szerver.',
sections:[
{h:'Biztonsági alapok',html:`<ul><li><b>Titkosítás<\/b>: a WEP elavult és feltörhető, a TKIP nem ajánlott, az <b>AES<\/b> ajánlott.<\/li>
<li><b>Azonosítás<\/b>: nyílt, WPA, WPA2, WPA2-<b>PSK<\/b> (Pre-Shared Key, közös jelszó) vagy vállalati, egyéni fiókos (WPA2 Enterprise).<\/li>
<li>A WPA2 ismert hibáját a <b>KRACK<\/b> támadás használja ki.<\/li><\/ul>
<p class="warn"><b>A jegyzetben eltér:<\/b> a PSK-t „PerSonal Key”-nek írja; a szokásos feloldás Pre-Shared Key.<\/p>`},
{h:'WiFi CSMA/CA-val',html:`<p>Rádión az ütközés nem érzékelhető, ezért a WiFi időablakokkal és <b>nyugtákkal<\/b> kerüli el (CSMA/CA).<\/p>`},
{anim:'csma',why:'Válts a CSMA/CA fülre.'},
{h:'Vállalati WiFi: RADIUS (AAA)',html:`<ul><li><b>AAA<\/b> = Authentication, Authorization, Accounting.<\/li>
<li>A jegyzet példája: AAA szerver 192.168.1.5, AP (WRT300N) 192.168.1.6, közös titok <code>titkosJelszo<\/code>, felhasználó <code>kiss.lajos<\/code> / <code>titok<\/code>.<\/li>
<li>Lépések: a szerveren AAA bekapcsolása, az AP felvétele kliensként a közös titokkal, felhasználók felvétele; az AP-n WPA2 a RADIUS szerver címével; a laptopon felhasználónév és jelszó.<\/li>
<li>Az AP maga nem ellenőriz, a szervertől kérdez. Kilépő dolgozónál elég a fiókját törölni.<\/li><\/ul>`},
{anim:'wifi',why:'A belépés útja a laptoptól a RADIUS szerverig és vissza.'}
]},
gy14:{src:['gy14-firewall.html'],lead:'Csomagszűrés Cisco routeren: hozzáférési listák (ACL) írása, interfészre tétele, ellenőrzése.',
sections:[
{h:'Típusok és sorszámok',html:`<ul><li><b>Normál (standard)<\/b> ACL: 1–99, csak egy címet vizsgál. <b>Kiterjesztett (extended)<\/b>: 100–199, forrás, cél, protokoll, port.<\/li>
<li>Nevesített lista: <code>ip access-list standard|extended NÉV<\/code>.<\/li>
<li>Két lépés: létrehozás, majd hozzárendelés az interfészhez <code>in<\/code> vagy <code>out<\/code> irányban.<\/li><\/ul>
<p class="warn"><b>A jegyzetben eltér:<\/b> ott a normál ACL a célt vizsgálja és 0–99 a sorszáma; a Cisco szerint a <b>forráscímet<\/b> vizsgálja, és <b>1–99<\/b>.<\/p>`},
{h:'Wildcard maszk',html:`<ul><li>A netmaszk inverze: 255.255.255.255 − maszk. Pl. 255.255.255.0 → <code>0.0.0.255<\/code>.<\/li>
<li>Egy gép: <code>host 192.168.10.11<\/code> (= 0.0.0.0). Bármi: <code>any<\/code> (= 0.0.0.0 255.255.255.255).<\/li><\/ul>`},
{h:'Parancsok',html:`<pre class="out">R1(config)# access-list 10 permit 192.168.10.0 0.0.0.255
R1(config)# ip access-list extended KIMENO
R1(config-ext-nacl)# permit tcp 192.168.100.0 0.0.0.255 host 192.168.200.5 eq www
R1(config-ext-nacl)# permit icmp host 192.168.100.12 host 192.168.200.5
R1(config-ext-nacl)# deny ip any any
R1(config)# interface g0/0/1
R1(config-if)# ip access-group KIMENO out
R1# show access-lists
R1(config)# ip access-list standard 10
R1(config-std-nacl)# no 20                 (csak a 20-as sor törlése)<\/pre>
<ul><li>A <code>show access-lists<\/code> sorszámokkal mutatja a sorokat (10, 20, …) és a találatokat.<\/li>
<li>Telnet/SSH korlátozása: a <code>line vty<\/code> alatt <code>access-class ADMIN-HOST in<\/code>.<\/li><\/ul>`},
{h:'Hogyan dönt a router?',html:`<ul><li>A sorokat <b>felülről lefelé<\/b> nézi, az <b>első illeszkedő<\/b> sor dönt, a többit nem vizsgálja.<\/li>
<li>A lista végén láthatatlan <b>implicit deny any<\/b> áll: ami semmire nem illik, eldobódik. Egy csak deny sorokból álló lista ezért mindent tilt.<\/li>
<li>Elhelyezés: a kiterjesztett listát a forráshoz közel, a normált a célhoz közel.<\/li><\/ul>
<p class="sub">Az első illeszkedés és az implicit deny a jegyzetben nincs kimondva, ez a Cisco működése; a jegyzet ezért zárja a listákat <code>deny any<\/code> sorral.<\/p>`},
{anim:'acl',why:'Szabálylisták és csomagok: próbáld ki, melyik sor dönt.'}
]},
gy15:{src:['gy15-nat.html'],lead:'NAT és PAT beállítása Cisco routeren, és a fordítási tábla értelmezése.',
sections:[
{h:'Belső és külső interfész',html:`<pre class="out">R1(config)# interface g0/0
R1(config-if)# ip address 192.168.1.1 255.255.255.0
R1(config-if)# ip nat inside
R1(config)# interface g0/1
R1(config-if)# ip address 193.225.32.1 255.255.255.0
R1(config-if)# ip nat outside<\/pre>
<p>Az <code>inside<\/code>/<code>outside<\/code> jelölés nélkül a NAT nem működik.<\/p>`},
{h:'Statikus NAT és PAT',html:`<pre class="out">! statikus: egy belső cím = egy külső cím
R1(config)# ip nat inside source static 192.168.1.11 193.225.32.11

! PAT: sok belső cím = a g0/1 egyetlen címe, portokkal
R1(config)# access-list 1 permit 192.168.1.0 0.0.0.255
R1(config)# ip nat inside source list 1 interface g0/1 overload

R1# show ip nat translations
R1# debug ip nat<\/pre>
<ul><li>Az ACL jelöli ki, mely belső címek fordíthatók. Az <b>overload<\/b> kulcsszó jelenti a PAT-ot.<\/li><\/ul>`},
{h:'A tábla olvasása',html:`<table class="lt"><thead><tr><th>Oszlop<\/th><th>Jelentés<\/th><\/tr><\/thead><tbody>
<tr><td>Inside local<\/td><td>a belső gép saját (privát) címe<\/td><\/tr>
<tr><td>Inside global<\/td><td>a belső gép címe kívülről nézve<\/td><\/tr>
<tr><td>Outside local / global<\/td><td>a külső gép címe (itt azonos)<\/td><\/tr><\/tbody><\/table>
<ul><li>Statikus NAT-nál egy <code>---<\/code> protokollú sor mutatja a fix párt.<\/li>
<li>PAT-nál minden sor a 193.225.32.1-et használja, csak a port más. <code>udp …:53<\/code> = DNS-kérés, <code>tcp …:80<\/code> = weboldal.<\/li><\/ul>`},
{anim:'nat',why:'Csomagonként: melyik mező íródik át, és mi kerül a táblába.'}
]}

ül kezelhetünk (SSH: titkosított parancssoros, Remote Desktop: grafikus felület).", "src": "e1-bevezetes.html", "osi": 7}, {"id": "e1-10", "ch": "e1", "t": "card", "q": "Sorold fel az OSI modell rétegeit felülről lefelé!", "b": "7. alkalmazási, 6. megjelenítési, 5. viszony, 4. szállítási, 3. hálózati, 2. adatkapcsolati, 1. fizikai.", "src": "e1-bevezetes.html", "osi": 0}, {"id": "e2-01", "ch": "e2", "t": "mc", "q": "Mi az átviteli sebesség mértékegysége?", "o": ["bájt/perc", "bit/sec", "Hz", "baud/óra"], "a": 1, "e": "Az egy másodperc alatt átvihető bitek száma.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-02", "ch": "e2", "t": "mc", "q": "Manchester kódolásnál mi hordozza az adatot?", "o": ["Az időszelet elején mért feszültség szintje", "Az időszelet közepén lévő jelváltás iránya", "Két egymást követő bit közötti szünet hossza", "Az időszelet végén mért jelerősség nagysága"], "a": 1, "e": "Minden időszelet közepén van jelváltás: felfutó él = 1, lefutó él = 0. Az Ethernet is használja.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-03", "ch": "e2", "t": "mc", "q": "NRZ kódolásnál hogyan jelenik meg az 1-es bit?", "o": ["Magas jelszinttel", "Lefutó éllel", "Felfutó éllel", "Jel hiányával"], "a": 0, "e": "NRZ: magas jelszint = 1, alacsony = 0; szinkron órát igényel.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-04", "ch": "e2", "t": "mc", "q": "Melyik a félduplex kommunikáció példája?", "o": ["Rádióadás hallgatása", "Telefonbeszélgetés", "Régi walkie-talkie", "Optikai gerinchálózat"], "a": 2, "e": "Félduplex: kétirányú, de egyszerre csak az egyik fél küldhet.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-05", "ch": "e2", "t": "card", "q": "Auto Negotiation", "b": "A berendezések automatikusan megegyeznek a közös legjobb sebességben és duplex módban, így nem kell kézzel beállítani.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-06", "ch": "e2", "t": "mc", "q": "Mekkora az UTP kábel maximális (erősítés nélküli) szegmenshossza?", "o": ["10 m", "100 m", "500 m", "2 km"], "a": 1, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-07", "ch": "e2", "t": "mc", "q": "Hány vezeték (ér) van egy UTP kábelben?", "o": ["2", "4", "8", "16"], "a": 2, "e": "8 vezeték, azaz 4 sodrott érpár.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-08", "ch": "e2", "t": "mc", "q": "Mit jelent az UTP rövidítés?", "o": ["Universal Transfer Protocol", "Unshielded Twisted Pair", "Unified Transmission Port", "Ultra Thin Pair"], "a": 1, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-09", "ch": "e2", "t": "mc", "q": "Melyik kábelváltozatnál van háló ÉS minden érpár külön fóliával árnyékolva?", "o": ["UTP", "F-UTP", "SF-UTP", "S-FTP"], "a": 3, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-10", "ch": "e2", "t": "mc", "q": "Melyik bekötési sorrend terjedt el Magyarországon?", "o": ["A", "B", "C", "Cross"], "a": 1, "e": "Az A-s főleg az USA-ban, a B-s Magyarországon elterjedt.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-11", "ch": "e2", "t": "card", "q": "Cross kábel", "b": "Egyik vége A-s, a másik B-s bekötésű; két számítógép switch vagy router nélkül közvetlenül összeköthető vele.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-12", "ch": "e2", "t": "mc", "q": "Melyik kábelkategória ad 1 Gbit/s sebességet?", "o": ["Cat3", "Cat5", "Cat5e", "Cat6"], "a": 2, "e": "Cat3: 10 Mbit/s, Cat5: 100 Mbit/s, Cat5e: 1 Gbit/s, Cat6: akár 10 Gbit/s.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-13", "ch": "e2", "t": "tf", "q": "A patch kábel és a fali kábel felcserélhető, nincs köztük érdemi különbség.", "a": false, "e": "A patch kábel puha (aljzat–gép), a fali kábel merevebb (épületi kiépítés). A felcserélés szakmai hiba.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-14", "ch": "e2", "t": "card", "q": "Hogyan állapítható meg utólag egy kiépített kábelszakasz hossza?", "b": "A kábel köpenyén méterenként fel van tüntetve a hossz, a két végpont jelöléséből kiszámítható.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-15", "ch": "e2", "t": "mc", "q": "Mekkora a multimódusú optikai kábel maximális hossza a jegyzet szerint?", "o": ["100 m", "500 m", "2 km", "Több ezer km"], "a": 2, "e": "A multimódusú szál vastagabb, nagyobb a jelvesztesége; max. 2 km. A monomódusú sokkal nagyobb távolságra (tengeralatti kábelek) is alkalmas.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-16", "ch": "e2", "t": "mc", "q": "Mi jellemzi a monomódusú optikai szálat?", "o": ["A fény a falakon visszaverődik", "Egyetlen, egyenes fénysugár, nagy távolság", "Max. 100 m hossz", "Rézből készül"], "a": 1, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-17", "ch": "e2", "t": "tf", "q": "Az optikai kábel kiépítési költségének nagy részét a munkadíj teszi ki, ezért érdemes tartalék szálakat is behúzni.", "a": true, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-18", "ch": "e2", "t": "mc", "q": "Melyik NEM optikai csatlakozótípus?", "o": ["RJ45", "ST", "LC", "SC"], "a": 0, "e": "Az RJ45 az UTP kábel csatlakozója; az optikaiak: FC, LC, SC, ST.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-19", "ch": "e2", "t": "mc", "q": "Mi igaz a 2,4 GHz-es Wi-Fi-re az 5 GHz-eshez képest?", "o": ["Gyorsabb és több csatornája van", "Jobban áthatol a falakon, nagyobb a hatótávolsága", "Kevésbé zavarja a mikrohullámú sütő", "Csak a 802.11ac használja"], "a": 1, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-20", "ch": "e2", "t": "mc", "q": "Melyik Wi-Fi szabvány használhatja a 6 GHz-es sávot is?", "o": ["802.11g", "802.11n", "802.11ac", "802.11ax"], "a": 3, "e": "802.11ax (2019): 2,4, 5 és 6 GHz, elméleti max. 9,6 Gbit/s.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-21", "ch": "e2", "t": "mc", "q": "Mekkora az NFC hatótávolsága?", "o": ["Kb. 100 méter", "Néhány kilométer", "Pár centiméter", "Kb. 10 méter"], "a": 2, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-22", "ch": "e2", "t": "card", "q": "Powerline (PLC)", "b": "Adatátvitel az elektromos hálózaton; csak ugyanazon elektromos hálózaton belül működik. Utólagos bővítésre, műemlék épületekhez jó, hálózattervezésre nem szokás használni.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-23", "ch": "e2", "t": "card", "q": "Zigbee", "b": "WPAN technológia, főleg okosotthon-eszközökhöz; nagyon alacsony fogyasztás és sebesség, kb. 10–100 m hatótáv. Van titkosítása, de publikáltak rá támadásokat.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-24", "ch": "e2", "t": "mc", "q": "Melyik topológiában „hall” minden eszköz minden forgalmat, és egy kábelszakadás az egészet megbénítja?", "o": ["Csillag", "Fa (hierarchikus)", "Sín (busz)", "Teljes háló (mesh)"], "a": 2, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-25", "ch": "e2", "t": "mc", "q": "Melyik topológia matematikai megfelelője az, hogy bármely két pont pontosan egy úton érhető el?", "o": ["Gyűrű", "Mesh", "Fa", "Hibrid"], "a": 2, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-26", "ch": "e2", "t": "mc", "q": "Mi a mesh topológia fő előnye?", "o": ["Nincs szükség útválasztásra a hálózatban", "Kevesebb kábel és olcsóbb kiépítés", "Egyetlen központi eszköz, könnyű kezelés", "Redundancia, alternatív útvonalak"], "a": 3, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-27", "ch": "e2", "t": "card", "q": "Fizikai vs. logikai topológia", "b": "Fizikai: az eszközök elrendezése. Logikai: pontosan melyik eszköz melyik csatlakozóval, hogyan kapcsolódik, milyen címekkel (pl. nyomtató en0, 192.168.1.3, switch g0/3). Tervezéshez és üzemeltetéshez a logikait használjuk.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-28", "ch": "e2", "t": "mc", "q": "Mit jelent a SOHO?", "o": ["Secure Office Home Office", "Small Office Home Office", "Single Operator Home Office", "Standard Office Hardware"], "a": 1, "e": "Kis teljesítményű, csökkentett funkciójú eszközök otthonra, kis irodába; vállalati használatra nem ajánlott.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-29", "ch": "e2", "t": "card", "q": "Van Eck-phreaking", "b": "Wim van Eck 1985-ös publikációja: monitorok (eredetileg katódsugárcsöves) képének lehallgatása elektromágneses kisugárzásuk alapján. Ma vezetékes eszközökre is alkalmazható.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-30", "ch": "e2", "t": "card", "q": "TEMPEST", "b": "Az NSA 1960-as években indított projektje a kisugárzás elleni védelemre és az ellenséges eszközök lehallgatására; ma amerikai és NATO szabvány.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-31", "ch": "e2", "t": "tf", "q": "Egy kábel lehallgatásához mindenképp meg kell szakítani a kábelt.", "a": false, "e": "A kisugárzás mérésével megszakítás nélkül is lehetséges.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-32", "ch": "e2", "t": "mc", "q": "Melyik hálózatméret-kategória a városi hálózat?", "o": ["LAN", "MAN", "WAN", "SMAN"], "a": 1, "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-33", "ch": "e2", "t": "mc", "q": "Melyik frekvenciasávban működik a 802.11b szabványú WiFi?", "o": ["2,4 GHz", "5 GHz", "6 GHz", "2,4 és 5 GHz"], "a": 0, "e": "802.11b (1999): 2,4 GHz, max. 11 Mbit/s. Az 5 GHz-es 1999-es szabvány a 802.11a (54 Mbit/s).", "megj": "A jegyzet táblázatában tévesen 5 GHz szerepel a 802.11b-nél.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e2-34", "ch": "e2", "t": "mc", "q": "Melyik WiFi szabvány használhatja a 6 GHz-es sávot is?", "o": ["802.11ax", "802.11ac", "802.11n", "802.11g"], "a": 0, "e": "802.11ax (2019): 2,4, 5 és 6 GHz, elméleti max. 9,6 Gbit/s.", "src": "e2-fizikai-reteg.html", "osi": 1}, {"id": "e3-01", "ch": "e3", "t": "mc", "q": "Hány bájtos egy Ethernet MAC cím?", "o": ["4", "6", "8", "16"], "a": 1, "e": "6 bájt, hexadecimálisan írva, pl. cc:08:fa:87:c3:9a.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-02", "ch": "e3", "t": "mc", "q": "Melyik a Cisco eszközökre jellemző MAC-cím írásmód?", "o": ["cc:08:fa:87:c3:9a", "cc-08-fa-87-c3-9a", "cc08.fa87.c39a", "cc08:fa87:c39a"], "a": 2, "e": "A Cisco kétbájtonként pontot használ.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-03", "ch": "e3", "t": "mc", "q": "Mit azonosít a MAC cím első 3 bájtja?", "o": ["A VLAN-t", "A gyártót (OUI)", "A portot", "Az alhálózatot"], "a": 1, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-04", "ch": "e3", "t": "mc", "q": "Mi az Ethernet broadcast cím?", "o": ["00:00:00:00:00:00", "ff:ff:ff:ff:ff:ff", "255.255.255.255", "01:00:5e:00:00:01"], "a": 1, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-05", "ch": "e3", "t": "card", "q": "BIA (Burned In Address)", "b": "A hálózati interfészbe gyárilag beégetett MAC cím. Cisco kimenetben: „address is 0060.3e45.5701 (bia 0060.3e45.5701)”. Szoftveresen gyakran felülírható.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-06", "ch": "e3", "t": "tf", "q": "A MAC-cím alapú szűrés erős védelmet nyújt, mert a MAC cím nem változtatható meg.", "a": false, "e": "A MAC cím szoftveresen gyakran módosítható (hamisítható), így a MAC szűrés könnyen kijátszható.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-07", "ch": "e3", "t": "mc", "q": "Melyik Windows paranccsal kérdezhető le a gép MAC címe (Physical Address)?", "o": ["ipconfig /all", "arp -d", "netstat -r", "tracert"], "a": 0, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-08", "ch": "e3", "t": "card", "q": "CRC (Cyclic Redundancy Check)", "b": "A feladó a keret bájtjaiból ellenőrző értéket számol és a végéhez fűzi; a vevő újraszámolja. Eltérés esetén a keret sérült, eldobják.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-09", "ch": "e3", "t": "mc", "q": "Milyen IEEE szabványszámon szabványosították az Ethernetet?", "o": ["802.1Q", "802.3", "802.11", "802.15"], "a": 1, "e": "802.3u: 100 Mbit/s, 802.3z: Gigabit, 802.1Q: VLAN, 802.11: Wi-Fi.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-10", "ch": "e3", "t": "mc", "q": "Melyik IEEE szabvány írja le a VLAN-okat?", "o": ["802.3u", "802.3z", "802.1Q", "802.11ac"], "a": 2, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-11", "ch": "e3", "t": "mc", "q": "Mi az Ethernet keret alapértelmezett maximális adatmérete a jegyzet szerint?", "o": ["512 bájt", "1500 bájt", "9000 bájt", "64 KB"], "a": 1, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-12", "ch": "e3", "t": "card", "q": "Protokoll és RFC", "b": "Protokoll: egy kommunikációtípus szabályainak összessége, ami lehetővé teszi különböző gyártók eszközeinek együttműködését. A leírásuk RFC (Request for Comment) dokumentumokban van, pl. POP3: RFC 1939.", "src": "e3-adatkapcsolati-reteg.html", "osi": 0}, {"id": "e3-13", "ch": "e3", "t": "mc", "q": "Mit tesz egy CSMA/CD-t használó interfész ütközés észlelésekor?", "o": ["Megduplázza a küldési sebességet és folytatja", "Abbahagyja, véletlenszerű idő után újrapróbálkozik", "Azonnal újraküldi a keretet a következő portra", "Eldobja a keretet és értesíti a felhasználót"], "a": 1, "e": "A véletlen várakozás megakadályozza, hogy újra azonos időzítéssel ütközzenek.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-14", "ch": "e3", "t": "mc", "q": "Hol használják a CSMA/CA-t?", "o": ["Optikai gerinchálózatban", "Vezeték nélküli hálózatokban", "Token Ringben", "Soros konzolkapcsolatban"], "a": 1, "e": "Vezeték nélkül az ütközés nem érzékelhető, ezért időablakokkal és nyugtákkal kerülik el.", "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-15", "ch": "e3", "t": "tf", "q": "Mai, switchelt, duplex Ethernet hálózatban normál esetben nincs ütközés.", "a": true, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-16", "ch": "e3", "t": "mc", "q": "Mi a jelismétlő (repeater) fő hátránya?", "o": ["Drága", "A zavarokat is felerősíti", "Csak optikán működik", "Nem tud broadcastot"], "a": 1, "src": "e3-adatkapcsolati-reteg.html", "osi": 2}, {"id": "e3-17", "ch": "e3", "t": "mc", "q": "Mit csinál a hub egy beérkező keret  statikus útvonal mellett a [1/0]-t?", "o": ["Slot / port a routeren", "Ugrásszám / TTL", "VLAN-szám / portszám", "Adminisztratív távolság / metrika"], "a": 3, "src": "gy6-ip-utvalasztas.html", "osi": 3}, {"id": "gy6-13", "ch": "gy6", "t": "mc", "q": "Mi a dinamikus útválasztó protokollok előnye (pl. OSPF)?", "o": ["Automatikusan cserélnek útvonal-információt", "Titkosítják a routerek közötti forgalmat", "Nem kell IP-címet adni az interfészeknek", "Kiváltják a switchek VLAN-beállításait"], "a": 0, "src": "gy6-ip-utvalasztas.html", "e": "Automatikusan cserélnek információt a hálózati változásokról.", "osi": 3}, {"id": "gy6-14", "ch": "gy6", "t": "card", "q": "Statikus útválasztás menete", "b": "1. Interfészek: ip address + no shutdown. 2. PC-ken default gateway. 3. Minden routeren ip route <távoli hálózat> <maszk> <next-hop> mindkét irányba, vagy ip route 0.0.0.0 0.0.0.0 <ISP> default. 4. Ellenőrzés: show ip route, ping.", "src": "gy6-ip-utvalasztas.html", "osi": 3}, {"id": "pt-03", "ch": "gy6", "t": "mc", "q": "Mi a 192.168.2.0/24 hálózat gépeinek helyes alapértelmezett átjárója?", "o": ["192.168.1.1", "Nem kell átjáró", "192.168.2.1", "192.168.2.254"], "a": 2, "out": "R1#show ip interface brief\nInterface              IP-Address      OK? Method Status                Protocol\nGigabitEthernet0/0     192.168.1.1     YES manual up                    up\nGigabitEthernet0/1     192.168.2.1     YES manual up                    up\nGigabitEthernet0/2     unassigned      YES NVRAM  administratively down down\nVlan1                  unassigned      YES NVRAM  administratively down down", "src": "gy6-ip-utvalasztas.html", "pt": true, "osi": 3}, {"id": "pt-04", "ch": "gy6", "t": "mc", "q": "Miért nem használható a GigabitEthernet0/2 jelenleg?", "o": ["Hibás a kábel, a link nem épül fel", "Egy másik routerhez van már bekötve", "Trunk módban van, ezért nem érhető el", "Nincs IP-címe, és kézzel le van tiltva"], "a": 3, "out": "R1#show ip interface brief\nInterface              I 68.200.1/32 is directly connected, GigabitEthernet0/0", "src": "gy6-ip-utvalasztas.html", "e": "Eldobja, mert nincs illeszkedő útvonal és nincs default route (Gateway of last resort is not set).", "pt": true, "osi": 3}, {"id": "pt-07", "ch": "gy6", "t": "mc", "q": "Mi R2 saját címe a GigabitEthernet0/0 interfészen?", "o": ["192.168.200.0", "192.168.200.1", "10.0.0.2", "10.0.0.1"], "a": 1, "out": "R2#show ip route\nGateway of last resort is not set\n    10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks\nC       10.0.0.0/24 is directly connected, GigabitEthernet0/1\nL       10.0.0.2/32 is directly connected, GigabitEthernet0/1\nS    192.168.100.0/24 [1/0] via 10.0.0.1\n    192.168.200.0/24 is variably subnetted, 2 subnets, 2 masks\nC       192.168.200.0/24 is directly connected, GigabitEthernet0/0\nL       192.168.200.1/32 is directly connected, GigabitEthernet0/0", "e": "Az L (Local) /32 bejegyzés a router saját címe.", "src": "gy6-ip-utvalasztas.html", "pt": true, "osi": 3}, {"id": "pt-08", "ch": "gy6", "t": "mc", "q": "Milyen paranccsal került be az S jelű sor?", "o": ["router ospf 1", "ip address 192.168.100.0 255.255.255.0", "ip route 0.0.0.0 0.0.0.0 10.0.0.1", "ip route 192.168.100.0 255.255.255.0 10.0.0.1"], "a": 3, "out": "R2#show ip route\nGateway of last resort is not set\n    10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks\nC       10.0.0.0/24 is directly connected, GigabitEthernet0/1\nL       10.0.0.2/32 is directly connected, GigabitEthernet0/1\nS    192.168.100.0/24 [1/0] via 10.0.0.1\n    192.168.200.0/24 is variably subnetted, 2 subnets, 2 masks\nC       192.168.200.0/24 is directly connected, GigabitEthernet0/0\nL       192.168.200.1/32 is directly connected, GigabitEthernet0/0", "src": "gy6-ip-utvalasztas.html", "pt": true, "osi": 3}, {"id": "pt-09", "ch": "gy6", "t": "mc", "q": "A PC3 (192.168.100.11) pingje ezt adja. Mi a hiba oka?", "o": ["A célgép ki van kapcsolva vagy nincs bekötve", "A PC3-on nincs beállítva alapértelmezett átjáró", "Az .225.32.11:2   192.168.1.11:2     193.225.32.10:2    193.225.32.10:2\n---  193.225.32.11     192.168.1.11       ---                ---", "src": "gy15-nat.html", "pt": true, "osi": 3}, {"id": "pt-24", "ch": "gy15", "t": "mc", "q": "Milyen NAT típus látszik itt?", "o": ["Dinamikus NAT-pool, több publikus címből választva", "PAT: minden kapcsolat a router külső címét használja", "Nincs fordítás, a belső címek kijutnak az internetre", "Statikus NAT: minden belső géphez külön cím tartozik"], "a": 1, "out": "R1# sh ip nat translations\nPro  Inside global     Inside local       Outside local      Outside global\nicmp 193.225.32.1:1    192.168.1.11:1     193.225.32.10:1    193.225.32.10:1\nudp  193.225.32.1:1025 192.168.1.11:1025  193.225.32.10:53   193.225.32.10:53\ntcp  193.225.32.1:1025 192.168.1.11:1025  193.225.32.10:80   193.225.32.10:80", "src": "gy15-nat.html", "e": "PAT (overload): minden kapcsolat a router külső címét (193.225.32.1) használja.", "pt": true, "osi": 3}, {"id": "pt-25", "ch": "gy15", "t": "mc", "q": "Mit jelez az udp …:53 sor?", "o": ["Pinget (ICMP)", "DNS-lekérdezést", "HTTP-forgalmat", "DHCP-kérést"], "a": 1, "out": "R1# sh ip nat translations\nPro  Inside global     Inside local       Outside local      Outside global\nicmp 193.225.32.1:1    192.168.1.11:1     193.225.32.10:1    193.225.32.10:1\nudp  193.225.32.1:1025 192.168.1.11:1025  193.225.32.10:53   193.225.32.10:53\ntcp  193.225.32.1:1025 192.168.1.11:1025  193.225.32.10:80   193.225.32.10:80", "src": "gy15-nat.html", "e": "DNS-lekérdezést (a www.company.com név feloldása).", "pt": true, "osi": 3}, {"id": "pt-26", "ch": "gy15", "t": "mc", "q": "Melyik szolgáltatást érte el a kliens a tcp sor szerint?", "o": ["SMTP", "HTTP", "SSH", "FTP"], "a": 1, "out": "R1# sh ip nat translations\nPro  Inside global     Inside local       Outside local      Outside global\nicmp 193.225.32.1:1    192.168.1.11:1     193.225.32.10:1    193.225.32.10:1\nudp  193.225.32.1:1025 192.168.1.11:1025  193.225.32.10:53   193.225.32.10:53\ntcp  193.225.32.1:1025 192.168.1.11:1025  193.225.32.10:80   193.225.32.10:80", "src": "gy15-nat.html", "e": "Web (HTTP). Web (HTTP, 80-as port).", "pt": true, "osi": 3}]}</script>
<script>
(function(){
const BANK=JSON.parse(document.getElementById('bank').textContent);
const META=BANK.meta, ALL=BANK.kerdesek;
const ORDER=META.sorrend, NAMES=META.fejezetek;
const SITE='https://nw.koczka.com/';
const KEY='nwgyakorlo-v1';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
// store[id] = {b: doboz 0-4, s: látott db, w: hibák db, t: utolsó időbélyeg}
function st(id){return store[id]||{b:0,s:0,w:0,t:0}}
function record(id,ok){const r=st(id);r.s++;r.t=Date.now();if(ok){r.b=Math.min(4,r.b+1)}else{r.b=0;r.w++}store[id]=r;save()}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function byCh(ch){return ALL.filter(q=>q.ch===ch)}
const quizzable=q=>q.t!=='card';
function mastered(q){return st(q.id).b>=2}
function wrongList(){return ALL.filter(q=>{const r=store[q.id];return r&&r.s>0&&r.b===0&&quizzable(q)})}
// Súlyozott választás: a még nem látott és a hibázott kérdések előre kerülnek.
function pick(pool,n){
  const w=q=>{const r=st(q.id);if(!r.s)return 3;return [5,2.5,1.2,.6,.3][r.b]};
  const scored=pool.map(q=>({q,k:Math.pow(Math.random(),1/w(q))}));
  scored.sort((a,b)=>b.k-a.k);
  return scored.slice(0,n).map(x=>x.q);
}
let session=null;
function groupOf(ch){return ch.startsWith('e')?'Elmélet':'Gyakorlatok'}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}

  session={kind:'exam',title:'Vizsgaszimuláció',items,i:0,ans:items.map(()=>null),opts:items.map(q=>q.t==='tf'?[{l:'Igaz',v:true,k:'I'},{l:'Hamis',v:false,k:'H'}]:shuffle(q.o.map((l,ix)=>({l,v:ix}))).map((o,ix)=>({...o,k:String(ix+1)}))),end:Date.now()+30*60*1000};
  clearInterval(examTimer);examTimer=setInterval(()=>{const el=document.getElementById('timer');if(!session||session.kind!=='exam'){clearInterval(examTimer);return}const ms=session.end-Date.now();if(ms<=0){clearInterval(examTimer);examFinish();return}if(el){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',ms<5*60000)}},500);

    ${q.out?`<pre class="out">${esc(q.out)}</pre>`:''}
    <div class="q">${esc(q.q)}</div>
    <div class="opts">${opts.map((o,ix)=>`<button class="opt ${s.ans[s.i]===ix?'sel':''}" type="button" data-ix="${ix}"><kbd>${o.k}</kbd><span>${esc(o.l)}</span></button>`).join('')}</div>

    <div class="hint">Itt nincs azonnali visszajelzés. A válaszaidat a beadásig módosíthatod.</div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>examPick(+b.dataset.ix));

function examFinish(){
  clearInterval(examTimer);const s=session;let good=0;const per={};const missed=[];
  s.items.forEach((q,k)=>{const a=s.ans[k];const ok=a!==null&&s.opts[k][a].v===q.a;if(a!==null)record(q.id,ok);if(ok)good++;else missed.push(q);const p=per[q.ch]=per[q.ch]||[0,0];p[1]++;if(ok)p[0]++});
  const pct=Math.round(100*good/s.items.length);
  const grade=pct>=85?'jeles':pct>=70?'jó':pct>=55?'közepes':pct>=40?'elégséges':'elégtelen';
  app.innerHTML=`<div class="panel"><h2>Vizsgaszimuláció: eredmény</h2>
    <div class="result">${good} / ${s.items.length} · ${pct}%</div>
    <div class="sub">Tájékoztató érdemjegy egy szokásos 40/55/70/85%-os skálán: <b>${grade}</b>. A tárgy valódi ponthatárait az oktató adja meg.</div>
    <h3>Fejezetenként</h3><div class="bych">${Object.keys(per).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(c=>`<div><span>${esc(NAMES[c])}</span><b>${per[c][0]}/${per[c][1]}</b></div>`).join('')}</div>
    ${missed.length?`<div class="missed"><h3>Hibás vagy kihagyott kérdések</h3>${missed.map(q=>`<div>${esc(q.q)}<br><b>${esc(q.t==='tf'?(q.a?'Igaz':'Hamis'):q.o[q.a])}</b>${q.e?`<div class="sub">${esc(q.e)}</div>`:''}</div>`).join('')}</div>`:''}
    <div class="actions">${missed.length?'<button class="primary" id="again" type="button">Hibásak gyakorlása</button>':''}<button id="back" type="button">Vissza a főoldalra</button></div></div>`;
  const ag=document.getElementById('again');if(ag){const m=missed;ag.onclick=()=>startQuiz(m,999,'Vizsga hibái')}
  document.getElementById('back').onclick=home;session=null;window.scrollTo(0,0);
}
function startCards(pool){session={kind:'cards',items:pick(pool,pool.length),i:0,flipped:false,known:0};showCard()}
function showCard(){
  const s=session,q=s.items[s.i];s.flipped=false;
  app.innerHTML=`<div class="panel">
    ${qtop(kOf(q.ch),s.i+1,s.items.length,'Fogalomkártyák',`tudtam: ${s.known}`)}
    ${ruler(s.items.length,[],s.i/s.items.length,(s.i+0.5)/s.items.length)}
    <div class="card" id="card" tabindex="0" role="button" aria-label="Kártya megfordítása">
      <h2>${esc(q.q)}</h2>${q.out?`<pre class="out">${esc(q.out)}</pre>`:''}
      <div class="back" id="back" hidden>${esc(q.b)}${q.megj?`<div class="megj" style="margin-top:8px"><b>A jegyzetben eltér:</b> ${esc(q.megj)}</div>`:''}</div>
      <div class="hint" id="flipHint">Kattints vagy nyomd meg a szóközt a megfordításhoz.</div>
    </div>
    ${exLinks(q)}${srcLink(q)}
    <div class="row"><button type="button" id="quit">Befejezés</button><span class="spacer"></span>
      <button type="button" id="no" disabled>Nem tudtam</button><button class="primary" type="button" id="yes" disabled>Tudtam</button></div></div>`;
  const flip=()=>{if(s.flipped)return;s.flipped=true;document.getElementById('back').hidden=false;document.getElementById('flipHint').hidden=true;document.getElementById('yes').disabled=false;document.getElementById('no').disabled=false;document.getElementById('yes').focus()};
  s.flip=flip;bindExLinks(app);
  document.getElementById('card').onclick=flip;
  const go=ok=>{record(q.id,ok);if(ok)s.known++;if(s.i<s.items.length-1){s.i++;showCard()}else{app.innerHTML=`<div class="panel"><h2>Kártyák vége</h2><div class="result">${s.known} / ${s.items.length}</div><div class="actions"><button class="primary" id="back2" type="button">Vissza a főoldalra</button></div></div>`;document.getElementById('back2').onclick=home;session=null}};
  s.go=go;
  document.getElementById('yes').onclick=()=>go(true);
  document.getElementById('no').onclick=()=>go(false);
  document.getElementById('quit').onclick=home;
}
document.addEventListener('keydown',e=>{
  if(!session||e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key.toLowerCase();
  if(session.kind==='quiz'){
    if(!session.answered){const ix=session.opts.findIndex(o=>o.k.toLowerCase()===k);if(ix>=0){e.preventDefault();answer(ix)}}
    else if(k==='enter'&&e.target.id!=='next'&&e.target.id!=='quit'){e.preventDefault();next()}
  }else if(session.kind==='exam'){
    const ix=session.opts[session.i].findIndex(o=>o.k.toLowerCase()===k);if(ix>=0){e.preventDefault();examPick(ix)}
  }else if(session.kind==='cards'){
    if(k===' '&&!session.flipped){e.preventDefault();session.flip()}
    else if(session.flipped&&(k==='1'||k==='n')){session.go(false)}
    else if(session.flipped&&(k==='2'||k==='t')){session.go(true)}
  }
});
document.getElementById('navLearn').onclick=learnHome;
document.getElementById('navBank').onclick=home;
route();
window.addEventListener('hashchange',route);
})();
</script>
