<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hálózatok gyakorló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: svájci stílusú, teljes szélességű színes sávok óriási groteszk címekkel; alul vonalzós haladásjelző és lejátszósáv. Egyetlen világos téma. */
  --paper:#e8e8e6; --surface:#f2f2f0; --ink:#0a0a0a; --muted:#5a5a56; --line:#cbcbc7;
  --accent:#0a0a0a; --accent-soft:#dcdcd8; --term:#141414; --term-ink:#ececea;
  --c1:#ffd25e; --c2:#bfb4af; --c3:#f9bdf1; --c4:#83a0da; --c5:#566b3e;
  --good:#1f7a3d; --good-soft:#d4ecd9; --bad:#c23526; --bad-soft:#f8d9d4; --warn:#8a5d00; --warn-soft:#fbecc4;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
input[type=range]{accent-color:var(--accent)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem;font-weight:600;letter-spacing:.01em}
h2{font-size:1.25rem;font-weight:600}
.sub{color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:120px}
.stat b{display:block;font:600 1.35rem var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
select{max-width:100%;min-width:0;font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chgroup h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 8px}
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ch{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px}
.ch .t{font-weight:600;font-size:.95rem}
.ch .m{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .s{background:var(--accent);opacity:.55}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.q{font-size:1.12rem;font-weight:500;max-width:68ch}
pre.out{margin:0;background:var(--term);color:var(--term-ink);font:13px/1.5 var(--mono);padding:14px;border-radius:6px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.opt kbd{font:500 .8rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;flex:none;margin-top:2px}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.feedback{border-left:4px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.feedback .fe{margin-top:6px}
.feedback.ok{border-color:var(--good);background:var(--good-soft)}
.feedback.no{border-color:var(--bad);background:var(--bad-soft)}
.megj{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.92rem}
.megj b{color:var(--warn)}
.src{font-size:.82rem;color:var(--muted)}
a{color:var(--accent)}
.card{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer}
.card .back{white-space:pre-line;border-top:1px dashed var(--line);padding-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#scope{flex:1 1 220px}
.timer{font:600 1rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bych{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;font-size:.9rem}
.bych div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.result{font:600 2.4rem var(--display);font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.missed div{border-bottom:1px solid var(--line);padding:6px 0}
.hint{color:var(--muted);font-size:.8rem}
.confirm{display:none;gap:8px;align-items:center}
.confirm.on{display:flex}

/* --- magyarázók --- */
.mono{font-family:var(--mono)}
code{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);padding:0 4px;border-radius:3px}
.txt{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.txt.mono{font-family:var(--mono);font-size:.92rem}
#sn-in{width:min(320px,100%)}
.txt.ok{border-color:var(--good);background:var(--good-soft)} .txt.no{border-color:var(--bad);background:var(--bad-soft)}
textarea.code{width:100%;font:13px/1.5 var(--mono);padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--term);color:var(--term-ink);resize:vertical}
.binwrap{overflow-x:auto}
table.bin{border-collapse:collapse;font-size:.9rem}
table.bin th{text-align:left;font-weight:500;color:var(--muted);padding:4px 12px 4px 0;white-space:nowrap}
table.bin td{padding:4px 12px 4px 0;white-space:nowrap}
table.bin tr.sum td,table.bin tr.sum th{border-top:1px solid var(--line);font-weight:600;color:var(--ink)}
.nb{color:var(--accent);font-weight:600} .hb{color:var(--warn)} .dot{color:var(--muted)}
.legend .nb,.legend .hb{font-family:var(--mono)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.kv div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kv span{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.tabs{gap:6px}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.stage{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.stage svg{display:block;width:100%;min-width:560px;height:auto}
.stage .link{stroke:var(--line);stroke-width:3}
.stage .llab{fill:var(--muted);font:11px var(--mono)}
.stage .msg{stroke:var(--accent);stroke-width:2.2}
.stage .msg.evil{stroke:var(--bad);stroke-dasharray:6 4}
.stage .arh{fill:var(--accent)} .stage .arhb{fill:var(--bad)}
.stage .pkt{fill:var(--accent)} .stage .pkt.evil{fill:var(--bad)}
.stage .mlab rect{fill:var(--surface);stroke:var(--accent);stroke-width:1}
.stage .mlab.evil rect{stroke:var(--bad)}
.stage .mlab text{fill:var(--ink);font:11.5px var(--body)}
.stage .node rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.stage .node.sw rect{fill:var(--accent-soft);stroke:var(--accent)}
.stage .node.evil rect{stroke:var(--bad);stroke-dasharray:4 3}
.stage .node.hl rect{stroke:var(--accent);stroke-width:3}
.stage .node.bad rect{fill:var(--bad-soft);stroke:var(--bad);stroke-width:3}
.stage .node.off{opacity:.35}
.stage .nl{fill:var(--ink);font:600 13px var(--body)} .stage .ns{fill:var(--muted);font:11px var(--mono)}
.stepbox{display:flex;flex-direction:column;gap:6px;min-height:96px}
.steptext{max-width:72ch}
.steptext pre.out{margin-top:8px}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--good-soft);color:var(--good)}
.tables{display:flex;flex-wrap:wrap;gap:12px}
.tblwrap{overflow-x:auto;flex:1 1 300px}
.tt{font-size:.8rem;color:var(--muted);margin-bottom:4px}
table.st{border-collapse:collapse;width:100%;font-size:.85rem}
table.st th{text-align:left;font-weight:600;border-bottom:2px solid var(--line);padding:4px 8px;white-space:nowrap}
table.st td{border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap}
tr.badrow td{background:var(--warn-soft)} tr.goodrow td{background:var(--good-soft)}
table.st.acl tr.badrow td{background:var(--bad-soft)}
.osi{display:grid;grid-template-columns:minmax(180px,230px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:600px){.osi{grid-template-columns:1fr}}
.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.layers li{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.9rem}
.layers li.on,.layers li.on2{border-color:var(--accent);background:var(--accent-soft)}
.layers li.done{color:var(--muted)}
.pdu{overflow-x:auto;margin-bottom:10px}
.seg{display:flex;gap:2px;min-width:max-content}
.seg .h{padding:10px 8px;font:12px var(--mono);border-radius:4px;color:#10212a;white-space:nowrap}
.seg .h.eth{background:#c9b8e8} .seg .h.ip{background:#a9d3e3} .seg .h.tcp{background:#b8e0c2} .seg .h.data{background:#f1dd9c}
.seg .h.new{outline:3px solid var(--ink);outline-offset:-3px}
.bits{padding:10px;background:var(--term);color:var(--term-ink);border-radius:6px;font-size:.85rem;overflow-x:auto;white-space:nowrap}
.rtout pre.out .ln{display:inline-block;min-width:100%}
.rtout pre.out .ln.cand{background:rgba(226,180,74,.18)}
.rtout pre.out .ln.win{background:rgba(92,192,127,.32);font-weight:500}
.chip{padding:4px 8px;font-size:.8rem}
.extiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.extiles .ch .d{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

/* ===== Új megjelenés (sávos, svájci stílus) ===== */
body{background:var(--paper);font-size:16px}
.wrap{max-width:1100px;padding:0 16px 140px;gap:0}
header{border:0;padding:18px 4px 14px;align-items:center}
h1{font:800 1.5rem var(--display);letter-spacing:-.02em}
h1 .os{color:var(--muted);font-weight:400}
.sub{color:var(--muted)}
header .sub a{color:inherit}
button{border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:600}
button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #2f6bff}
select{border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:600;padding:7px 12px}
.screen{border-radius:28px;overflow:hidden;background:var(--surface);box-shadow:0 30px 60px -30px rgba(0,0,0,.35),0 0 0 6px #1d2b33,0 0 0 8px #3d5866}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;font:600 .82rem var(--body);background:var(--c1)}
.statusbar span:nth-child(2){color:rgba(0,0,0,.72);font-weight:500}
.bands{display:flex;flex-direction:column}
.band{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);min-height:100px;max-height:100px;overflow:hidden;transition:max-height .3s ease;position:relative;color:#0a0a0a}
.band:hover,.band:focus-visible,.band.open{max-height:220px}
.band:focus-visible{outline:4px solid #0a0a0a;outline-offset:-4px}
.band .l{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:14px;row-gap:0;padding:14px 18px 10px;align-content:start}
.band .num,.band .go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 1.1rem var(--body);margin-top:6px}
.band .num{background:rgba(255,255,255,.35)}
.band .go{background:#0a0a0a;color:var(--surface)}
.band .go svg{width:22px;height:22px}
.band .t1,.band .t2{font:800 clamp(2rem,5.4vw,3.6rem)/1.02 var(--display);letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .r{border-left:1px solid rgba(0,0,0,.18);margin:12px 0;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.band .lab{font:700 .78rem/1.25 var(--body)}
.band .lab span{display:block}
.band .gr{margin-top:14px;font-size:.78rem;line-height:1.3;color:rgba(0,0,0,.72)}
.band .ic{width:64px;height:64px}
.band .ic svg{width:100%;height:100%;fill:none;stroke:#0a0a0a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.band .pb{grid-column:1/-1;height:4px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;margin-top:6px}
.band .pb i{display:block;height:100%;background:#0a0a0a}
.band.k1{background:var(--c1)} .band.k2{background:var(--c2)} .band.k3{background:var(--c3)} .band.k4{background:var(--c4)} .band.k5{background:var(--c5)}
.band.k5 .num{background:rgba(255,255,255,.18)}
.secthead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 8px;font:800 1.1rem var(--display);letter-spacing:-.01em;background:var(--surface)}
.secthead span{font:500 .8rem var(--body);color:var(--muted)}
@media (max-width:640px){.band{grid-template-columns:minmax(0,1fr) 92px;min-height:84px;max-height:84px}.band .l{grid-template-columns:40px minmax(0,1fr);padding:12px 10px 8px;column-gap:10px}.band .num,.band .go{width:36px;height:36px;font-size:.95rem}.band .r{padding:0 10px;grid-template-columns:1fr}.band .lab,.band .gr{display:none}.band .ic{width:48px;height:48px;justify-self:center}}
/* vonalzó */
.ruler{position:relative;height:34px;background:var(--surface);border-top:1px solid var(--line);overflow:hidden}
.ruler svg{display:block;width:100%;height:100%}
.ruler .tk{stroke:#b9b9b4;stroke-width:1}
.ruler .tk.m{stroke:#0a0a0a;stroke-width:1.5}
.ruler .fill{fill:#d3d3cf}
.ruler .cur{stroke:#0a0a0a;stroke-width:3}
/* alsó lejátszósáv */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(1100px,calc(100% - 24px));background:var(--surface);border-radius:26px;box-shadow:0 18px 40px -20px rgba(0,0,0,.45),0 0 0 1px var(--line);overflow:hidden;z-index:5}
.dock .dbar{display:flex;align-items:center;gap:14px;padding:10px 18px 12px;flex-wrap:wrap}
.dock .play{all:unset;cursor:pointer;width:48px;height:48px;display:grid;place-items:center;flex:none}.dock .play::before{content:'';width:36px;height:44px;background:#0a0a0a;clip-path:polygon(0 0,100% 50%,0 100%)}
.dock .play:focus-visible{outline:3px solid #2f6bff;outline-offset:6px}
.dock .big{font:500 clamp(2.4rem,6vw,3.6rem)/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dock .of{font:600 .75rem var(--body);color:var(--muted);align-self:flex-start;margin-top:4px}
.dock .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
.dock .round{width:52px;height:52px;border-radius:50%;background:#0a0a0a;color:var(--surface);display:grid;place-items:center;padding:0;border:0}
.dock .round svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.dock label{font:600 .8rem var(--body);color:var(--muted)}
/* kvíz */
.panel{background:var(--surface);border:0;border-radius:28px;padding:0;gap:0;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.panel>*{margin-left:22px;margin-right:22px}
.panel>*:last-child{margin-bottom:22px}
.panel>.qtop,.panel>.ruler,.panel>.stage,.panel>pre.out{margin-left:0;margin-right:0}
.panel>*+*{margin-top:14px}
.panel h2{margin-top:22px;font:800 clamp(1.6rem,3.6vw,2.4rem)/1.05 var(--display);letter-spacing:-.03em}
.qtop{display:flex;align-items:flex-end;gap:12px;padding:16px 22px 12px;color:#0a0a0a}
.qtop .big{font:500 clamp(3rem,8vw,5rem)/.9 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.qtop .of{font:600 .8rem var(--body);opacity:.6;align-self:flex-start}
.qtop .meta{margin-left:auto;text-align:right;font:700 .8rem/1.3 var(--body)}
.qtop .meta span{display:block;font-weight:500;opacity:.6}
.qtop.k1{background:var(--c1)}.qtop.k2{background:var(--c2)}.qtop.k3{background:var(--c3)}.qtop.k4{background:var(--c4)}.qtop.k5{background:var(--c5)}
.q{font:700 clamp(1.25rem,2.6vw,1.6rem)/1.25 var(--display);letter-spacing:-.015em;max-width:40ch}
.panel>pre.out{border-radius:0;padding:16px 22px}
.opts{gap:0;border-top:1px solid var(--line)}
.opt{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:14px 4px;font-weight:500;gap:14px;align-items:center}
@media (hover:hover){.opt:hover{background:var(--accent-soft);color:var(--ink)}}
.opt kbd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:0;background:#0a0a0a;color:var(--surface);font:700 .85rem var(--body);margin:0;flex:none}
.opt.ok{background:var(--good-soft)} .opt.ok kbd{background:var(--good)}
.opt.no{background:var(--bad-soft)} .opt.no kbd{background:var(--bad)}
.opt.sel{background:var(--c1)}
.feedback{border-radius:16px;border-left:0;padding:12px 16px}
.megj{border-radius:16px;border-left:0}
.pill{background:#0a0a0a;color:var(--surface)}
.result{font:500 clamp(3rem,9vw,5.5rem)/1 var(--display);letter-spacing:-.05em}
.card{min-height:220px}
.card h2{margin:0}
.qhead{color:var(--muted)}
.stage{border-radius:0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stage .node rect{fill:var(--surface);stroke:#0a0a0a;stroke-width:1.6;rx:12}
.stage .node.sw rect{fill:var(--c1);stroke:#0a0a0a}
.stage .node.hl rect{fill:var(--c4);stroke:#0a0a0a;stroke-width:2.4}
.stage .node.bad rect{fill:var(--c3);stroke:var(--bad)}
.stage .msg{stroke:#0a0a0a} .stage .arh{fill:#0a0a0a} .stage .pkt{fill:#0a0a0a}
.stage .mlab rect{stroke:#0a0a0a;rx:10}
.layers li.on,.layers li.on2{background:var(--c1);border-color:#0a0a0a}
.tab.on{background:#0a0a0a;color:var(--surface)}
.kv div{border-radius:14px;background:var(--paper);border:0}
.txt{border-radius:12px;border:1.5px solid var(--line)}
.stats{display:none}

.dotc{width:9px;height:9px;border-radius:50%;background:var(--l3)} .dotc.evil{background:var(--ev)} .dotc.ok{background:var(--okc)}
.pi-sel{display:flex;gap:6px;flex-wrap:wrap}
.pi-sel button{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;min-height:32px;font-size:.78rem;cursor:pointer;color:var(--mu)}
.pi-sel button.on{border-color:var(--tx);color:var(--tx)} .pi-sel button.evil.on{border-color:var(--ev)}
.pi-stack{display:flex;flex-direction:column;gap:6px}
.pi-l{border:1px solid var(--ln);border-left:4px solid var(--c,var(--l3));border-radius:10px;background:var(--bg2);overflow:hidden}
.pi-l.l1{--c:var(--l1)}.pi-l.l2{--c:var(--l2)}.pi-l.l3{--c:var(--l3)}.pi-l.l4{--c:var(--l4)}.pi-l.l7{--c:var(--l7)}
.pi-l summary{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;list-style:none;font-size:.88rem}
.pi-l summary::-webkit-details-marker{display:none}
.pi-l summary::before{content:'▸';color:var(--mu);font-size:.8rem;transition:transform .15s}
.pi-l[open] summary::before{transform:rotate(90deg)}
.pi-osi{font:700 .68rem var(--mono);color:var(--bg);background:var(--c);border-radius:5px;padding:1px 6px}
.pi-n{margin-left:auto;color:var(--mu);font:.75rem var(--mono)}
.pi-new{font:700 .66rem var(--mono);color:#0b1020;background:#ffd25e;border-radius:5px;padding:1px 6px}
table.pi-f{width:100%;border-collapse:collapse;font-size:.78rem}
table.pi-f tr{border-top:1px solid #1f2a4d;cursor:default}
table.pi-f th{text-align:left;font-weight:500;color:var(--mu);padding:4px 8px 4px 12px;width:38%;vertical-align:top}
table.pi-f td{padding:4px 8px;vertical-align:top}
table.pi-f td.v{color:var(--tx);font-family:var(--mono);word-break:break-word}
table.pi-f td.hx{color:#7f8bb8;font-family:var(--mono);white-space:nowrap;text-align:right;font-size:.72rem}
table.pi-f .nt{display:block;font-family:var(--body);color:var(--mu);font-size:.72rem}
table.pi-f tr.chg td.v{color:#ffd25e}
table.pi-f tr.lit{background:rgba(230,235,255,.08)}
.pi-hh{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-top:4px}
.pi-hex{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;font:11px/1 var(--mono);background:#060912;border:1px solid var(--ln);border-radius:10px;padding:8px}
.pi-hex .hb{padding:4px 0;text-align:center;border-radius:3px;color:var(--c,var(--l3));background:color-mix(in srgb,var(--c,var(--l3)) 9%,transparent);cursor:default}
.pi-hex .hb.l1{--c:var(--l1)}.pi-hex .hb.l2{--c:var(--l2)}.pi-hex .hb.l3{--c:var(--l3)}.pi-hex .hb.l4{--c:var(--l4)}.pi-hex .hb.l7{--c:var(--l7)}
.pi-hex .hb.chg{outline:1px solid #ffd25e;outline-offset:-1px}
.pi-hex .hb.fold{grid-column:span 4;font-size:10px;color:var(--mu)}
.pi-hex .hb.lit{background:var(--c,var(--l3));color:#0b1020}
@media (max-width:640px){.pi-hex{font-size:9.5px;gap:1px;padding:6px}.pex-tl button span{display:none}.pex-tl button{padding:6px}.pex-stage{margin:10px 10px 0}.pex-ctl,.pex-tl,.pex-tabs{padding-left:10px;padding-right:10px}}
@media (prefers-reduced-motion:reduce){.pex-stage .ml,.pex-stage .chip.land{transition:none}.pex-stage .nd.ping .halo{animation:none}}

<body>
<div class="wrap">
  <header>
    <div><h1>Hálózatok <span class="os">gyakorló</span></h1><div class="sub">Magyarázók, animációk és kérdésbank a <a href="https://nw.koczka.com/">nw.koczka.com</a> jegyzetéhez</div></div>
    <nav class="topnav" aria-label="Fő részek"><button id="navLearn" type="button">Tananyag</button><button id="navBank" type="button">Kérdésbank</button></nav>
  </header>
  <main id="app"></main>
</div>
<script>__EXPL__</script>
<script>__LESSONS__</script>
<script id="bank" type="application/json">__BANK__</script>
<script>
(function(){
const BANK=JSON.parse(document.getElementById('bank').textContent);
const META=BANK.meta, ALL=BANK.kerdesek;
const ORDER=META.sorrend, NAMES=META.fejezetek;
const SITE='https://nw.koczka.com/';
const KEY='nwgyakorlo-v1';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
// store[id] = {b: doboz 0-4, s: látott db, w: hibák db, t: utolsó időbélyeg}
function st(id){return store[id]||{b:0,s:0,w:0,t:0}}
function record(id,ok){const r=st(id);r.s++;r.t=Date.now();if(ok){r.b=Math.min(4,r.b+1)}else{r.b=0;r.w++}store[id]=r;save()}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function byCh(ch){return ALL.filter(q=>q.ch===ch)}
const quizzable=q=>q.t!=='card';
function mastered(q){return st(q.id).b>=2}
function wrongList(){return ALL.filter(q=>{const r=store[q.id];return r&&r.s>0&&r.b===0&&quizzable(q)})}
// Súlyozott választás: a még nem látott és a hibázott kérdések előre kerülnek.
function pick(pool,n){
  const w=q=>{const r=st(q.id);if(!r.s)return 3;return [5,2.5,1.2,.6,.3][r.b]};
  const scored=pool.map(q=>({q,k:Math.pow(Math.random(),1/w(q))}));
  scored.sort((a,b)=>b.k-a.k);
  return scored.slice(0,n).map(x=>x.q);
}
let session=null;
function groupOf(ch){return ch.startsWith('e')?'Elmélet':'Gyakorlatok'}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}
function setTab(t){const a=document.getElementById('navLearn'),b=document.getElementById('navBank');if(!a)return;a.classList.toggle('on',t==='learn');b.classList.toggle('on',t==='bank');a.setAttribute('aria-current',t==='learn'?'page':'false');b.setAttribute('aria-current',t==='bank'?'page':'false')}
function openEx(id){session=null;setHash(id);setTab('learn');window.EXPL.open(id,app)}
const LESSONS=window.LESSONS||{};
function lessonAnims(c){return (LESSONS[c]?LESSONS[c].sections:[]).filter(x=>x.anim).map(x=>x.anim)}

const OSI=[{id:7,short:'DHCP, DNS, web, SSH',n:'5–7',t1:'Alkalmazási',t2:'rétegek',name:'5–7. Alkalmazási rétegek',sub:'viszony, megjelenítés, alkalmazás: DHCP, DNS, web, e-mail, SSH',ic:'globe',k:'k1'},
 {id:4,short:'TCP, UDP, portok',n:'4',t1:'Szállítási',t2:'réteg',name:'4. Szállítási réteg',sub:'TCP, UDP, portok, kiterjesztett ACL',ic:'arrows',k:'k2'},
 {id:3,short:'IP, routing, ARP, NAT, ACL',n:'3',t1:'Hálózati',t2:'réteg',name:'3. Hálózati réteg',sub:'IP-cím, alhálózat, routing, ARP, ICMP, NAT, ACL',ic:'router',k:'k3'},
 {id:2,short:'Ethernet, MAC, VLAN, WiFi',n:'2',t1:'Adatkapcsolati',t2:'réteg',name:'2. Adatkapcsolati réteg',sub:'Ethernet, MAC, switch, CAM, VLAN, WiFi-azonosítás',ic:'sw',k:'k4'},
 {id:1,short:'kábelek, jelek, frekvenciák',n:'1',t1:'Fizikai',t2:'réteg',name:'1. Fizikai réteg',sub:'kábelek, jelkódolás, átviteli módok, frekvenciák, topológiák',ic:'cable',k:'k5'},
 {id:0,short:'OSI-modell, Cisco IOS',n:'∑',t1:'Átfogó',t2:'OSI-modell, Cisco IOS',name:'Átfogó: OSI-modell és eszközkezelés',sub:'a rétegmodell egésze, Cisco IOS kezelés, jelszavak',ic:'layers',k:'k1'}];
const OSI_OF=Object.fromEntries(OSI.map(o=>[o.id,o]));
// Főfejezetek = OSI-rétegek, alulról felfelé, ahogy a jegyzet is halad. members: azok a leckék, amelyek elsődlegesen ehhez a réteghez tartoznak.
const FOLDERS=[{id:'r0',osi:0,members:['e1','gyios']},{id:'r1',osi:1,members:['e2']},{id:'r2',osi:2,members:['e3','gy5','gy10']},
 {id:'r3',osi:3,members:['e4','gy6','gy7','e8','gy14','gy15']},{id:'r4',osi:4,members:['e6']},{id:'r7',osi:7,members:['e5','gy9','e9','gy0']}];
const FOLDER_OF={},FOLDER_BY_OSI={};FOLDERS.forEach((f,ix)=>{f.n=ix+1;f.o=OSI.find(o=>o.id===f.osi);FOLDER_BY_OSI[f.osi]=f;f.members.forEach(m=>FOLDER_OF[m]=f)});
const LORDER=FOLDERS.flatMap(f=>f.members);
const LAYERLEAD={0:'A rétegmodell egésze: mit csinálnak az egyes rétegek, hogyan ágyazódnak egymásba a fejlécek, és a Cisco IOS eszközök alapkezelése, ami minden réteg gyakorlatához kell.',
 1:'A bitek fizikai átvitele: jelek és kódolás, átviteli módok, kábelek, vezeték nélküli átvitel és topológiák.',
 2:'Kereteket juttat el egy hálózaton belül, MAC-címek alapján. Itt dolgozik a switch, itt van a közeghozzáférés, a VLAN és a WiFi hozzáférés-vezérlése.',
 3:'IP-címekkel juttatja el a csomagot hálózatok között. Itt dolgozik a router: alhálózatok, útválasztás, ARP, ICMP, címfordítás és csomagszűrés.',
 4:'Alkalmazások között szállítja az adatot végponttól végpontig: portok, a megbízható TCP és a gyors UDP.',
 7:'A jegyzet szerint az internet a viszony-, a megjelenítési és az alkalmazási réteget egyben kezeli, ezért ezek itt együtt vannak: DHCP, DNS, tanúsítványok, távoli elérés, böngészők.'};
// Leckerészek rétege: 'L' vagy 'L+a+b' (a,b: érintett további rétegek), 'A' = animáció (réteg az EXOSI-ból)
const SECL={e1:['0','0','A'],e2:['1','1','1','1','1','1','A'],e3:['2','2','2+1','A','2+1','A','2','A','2'],
 e4:['3+2','A','3','A','3','A','3+2','A','3','A','3+7'],e5:['7+3+4','A','7+3','7+3','7+2+3'],e6:['4+7','4','4','A','3+4','A'],
 e8:['3+4+7','A','3','3','3+4','A'],e9:['7+4','A','7','7','7+3'],gy0:['7','7','7+3','A'],gyios:['0','0','0','0','0','7+0+4','A'],
 gy5:['2','2','A','2'],gy6:['3','3','3','A','3','A'],gy7:['3','3','A'],gy9:['7+3','A','7+3','A'],gy10:['2+1','2+1','A','2+7','A'],
 gy14:['3+4','3','3+4','3+4','A'],gy15:['3','3+4','3+4','A']};

const EXOSI={osi:0,telnet:7,dns:7,dhcp:7,relay:7,tcp:4,trace:3,subnet:3,routing:3,arp:3,nat:3,acl:3,cam:2,vlan:2,csma:2,wifi:2};
const ANIMALSO={osi:[1,2,3,4,7],arp:[2],dhcp:[3,4],relay:[3],trace:[4],dns:[4],nat:[4],acl:[4],csma:[1],wifi:[7],telnet:[4]};
function secInfo(c,i){const x=LESSONS[c].sections[i];if(x.anim)return {osi:EXOSI[x.anim]??0,also:ANIMALSO[x.anim]||[]};
  const v=((SECL[c]||[])[i]||String(FOLDER_OF[c]?FOLDER_OF[c].osi:0)).split('+').map(Number);return {osi:v[0],also:v.slice(1).filter(y=>y!==v[0])}}
function lessonSecs(c){return LESSONS[c]?LESSONS[c].sections.map((x,i)=>({...secInfo(c,i),i,h:x.h,anim:x.anim})):[]}
const nmShort=c=>(/^gy/.test(c)?NAMES[c].split('.')[0]+' · ':'')+NAMES[c].replace(/^(Gy\d+[–\d]*\.|\d+[–\d]*\.)\s*/,'');
let ctxFolder=null;
const osiLabel=id=>id===0?'Átfogó':(id===7?'OSI 5–7':'OSI '+id);
function osiPool(id,base){return (base||ALL).filter(q=>(q.osi??0)===id)}
function folderAnims(f){return window.EXPL.list.map(e=>e.id).filter(a=>(EXOSI[a]??0)===f.osi)}
function folderPool(f){return osiPool(f.osi)}
const fK=f=>f.o.k;
function learnHome(){
  session=null;window.EXPL.key=null;setHash('');setTab('learn');
  const qz=ALL.filter(quizzable), mast=qz.filter(mastered).length;
  const d=new Date();const days=['Vas','Hét','Ked','Sze','Csü','Pén','Szo'],mons=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  let h=`<div class="screen"><div class="statusbar"><span>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span><span>${days[d.getDay()]} ${mons[d.getMonth()]} ${d.getDate()}.</span><span>${mast}/${qz.length}</span></div>`;
  h+=`<div class="pagehead"><h2>Tananyag</h2><p class="sub">A főfejezetek az OSI-rétegek, alulról felfelé, ahogy a jegyzet is halad. Minden rétegben ott van a hozzá tartozó elmélet, gyakorlat, animáció és kérdés. Ami több réteget is érint, annak a többi rétegben is van hivatkozása. Az 5–7. réteg a jegyzet szerint egy csoport.</p></div>`;
  h+=`<div class="secthead">OSI-rétegek<span>kattints egy sávra</span></div><div class="bands">`+FOLDERS.map(f=>{
      const qs=folderPool(f).filter(quizzable), m=qs.filter(mastered).length, o=f.o;
      const ls=LORDER.filter(c=>lessonSecs(c).some(x=>!x.anim&&x.osi===f.osi));
      return band({k:fK(f),num:o.n,t1:o.t1,t2:o.t2,lab1:o.short,lab2:`${ls.length} lecke · ${folderAnims(f).length} animáció · ${qs.length} kérdés`,gr:`${m} begyakorolt`,ic:`<span class="ic" aria-hidden="true"><svg viewBox="0 0 64 64">${IC[o.ic]||IC.layers}</svg></span>`,pct:qs.length?Math.round(100*m/qs.length):0,attr:`data-folder="${f.id}" aria-label="${esc(o.name)}: megnyitás"`})}).join('')+`</div>`;
  h+=`<div class="secthead" style="padding-bottom:22px;display:block"><button class="tobank" id="goBank" type="button">Tovább a kérdésbankhoz →</button></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>openFolder(b.dataset.folder));
  document.getElementById('goBank').onclick=home;
}
function lcard(c,label){const L=LESSONS[c];const qs=byCh(c).filter(quizzable),m=qs.filter(mastered).length;
  return `<button type="button" class="lcard" data-lesson="${c}"><span class="lk">${label}</span><span class="lt2">${esc(NAMES[c].replace(/^\d+[–\d]*\.\s*/,''))}</span><span class="ls">${L?esc(L.lead):''}</span><span class="lm">${L?L.sections.filter(x=>x.h).length:0} rész · ${lessonAnims(c).length} animáció · ${qs.length} kérdés · ${m} begyakorolt</span><span class="la" aria-hidden="true">→</span></button>`}
function lblock(c,f,own){const secs=lessonSecs(c).filter(x=>!x.anim&&x.osi===f.osi);const qs=byCh(c).filter(quizzable),m=qs.filter(mastered).length;
  const pf=FOLDER_OF[c],isT=!/^gy/.test(c);
  const lab=own?(isT?'Elméleti fejezet':NAMES[c].split('.')[0]+'. gyakorlat'):`Részlet · a lecke fő rétege: ${osiLabel(pf.osi)}`;
  return `<div class="lblock${own?'':' part'}"><button type="button" class="lhead" data-lesson="${c}"><span class="lk">${esc(lab)}</span><span class="lt2">${esc(nmShort(c))}</span>${own?`<span class="ls">${esc((LESSONS[c]||{}).lead||'')}</span>`:''}<span class="lm">${qs.length} kérdés · ${m} begyakorolt</span><span class="la" aria-hidden="true">→</span></button>
   <div class="secl">${secs.map(x=>`<button type="button" class="seclink" data-sec="${c}.${x.i}">${esc(x.h)}${x.also.length?`<span class="also">${x.also.map(osiLabel).join(', ')}</span>`:''}</button>`).join('')}</div></div>`}
function openFolder(id){
  let f=FOLDERS.find(x=>x.id===id);if(!f&&FOLDER_OF[id])f=FOLDER_OF[id];if(!f){learnHome();return}
  session=null;window.EXPL.key=null;setHash('fejezet-'+f.id);setTab('learn');ctxFolder=f.id;
  const o=f.o,pool=folderPool(f),qs=pool.filter(quizzable),cards=pool.filter(q=>q.t==='card'),an=folderAnims(f),k=fK(f);
  const prev=FOLDERS[f.n-2],nxt=FOLDERS[f.n];
  const has=c=>lessonSecs(c).some(x=>!x.anim&&x.osi===f.osi);
  const own=f.members.filter(has), other=LORDER.filter(c=>!f.members.includes(c)&&has(c));
  const ownT=own.filter(c=>!/^gy/.test(c)),ownG=own.filter(c=>/^gy/.test(c));
  const rel=[];LORDER.forEach(c=>lessonSecs(c).forEach(x=>{if(!x.anim&&x.osi!==f.osi&&x.also.includes(f.osi))rel.push({c,...x})}));
  const relA=Object.keys(ANIMALSO).filter(a=>ANIMALSO[a].includes(f.osi)&&(EXOSI[a]??0)!==f.osi);
  const acard=a=>{const e=window.EXPL.list.find(y=>y.id===a);return e?`<button type="button" class="animcard ${k}" data-anim="${a}"><span class="ptri" aria-hidden="true"></span><span class="at"><b>${esc(e.title)}</b><span>${esc(e.desc)}</span></span></button>`:''};
  app.innerHTML=`<div class="panel folder">
    <div class="qtop ${k}"><span class="big">${o.n}</span><span class="of">OSI</span><span class="meta">${esc(o.name)}<span>${own.length+other.length} lecke · ${an.length} animáció · ${qs.length} kérdés</span></span></div>
    <p class="lead">${esc(LAYERLEAD[f.osi])}</p>
    ${f.osi===3?'<p class="tip folderTip">A jegyzet az ICMP-t a szállítási rétegnél tárgyalja, de az ICMP az IP része, ezért itt, a 3. rétegben van. A 4. rétegből hivatkozás mutat ide.</p>':''}
    <h3 class="fh">Elmélet</h3>
    ${ownT.length?ownT.map(c=>lblock(c,f,true)).join(''):'<p class="sub fsub">Ehhez a réteghez nincs önálló elméleti fejezet, a részek lent vannak.</p>'}
    <h3 class="fh">Gyakorlatok</h3>
    ${ownG.length?ownG.map(c=>lblock(c,f,true)).join(''):'<p class="sub fsub">Ehhez a réteghez a jegyzetben nincs külön gyakorlat.</p>'}
    ${other.length?`<h3 class="fh">Ide tartozó részek más leckékből</h3>${other.map(c=>lblock(c,f,false)).join('')}`:''}
    ${an.length?`<h3 class="fh">Animációk</h3><div class="agrid">${an.map(acard).join('')}</div>`:''}
    ${rel.length||relA.length?`<h3 class="fh">Kapcsolódó ismeretek más rétegekben</h3><p class="sub fsub">Ezek a témák egy másik réteghez tartoznak, de ezt a réteget is érintik.</p>
      <div class="rellist">${rel.map(x=>`<button type="button" class="relrow" data-sec="${x.c}.${x.i}"><span class="osichip ${OSI_OF[x.osi].k}">${osiLabel(x.osi)}</span><span><b>${esc(x.h)}</b><span>${esc(nmShort(x.c))}</span></span></button>`).join('')}</div>
      ${relA.length?`<div class="agrid">${relA.map(a=>acard(a).replace('</b>',` <span class="osichip inl">${osiLabel(EXOSI[a]??0)}</span></b>`)).join('')}</div>`:''}`:''}
    <div class="practice"><div><b>Kérdések: ${esc(o.name)}</b><span class="sub">${qs.length} kérdés és ${cards.length} fogalomkártya ebből a rétegből, az elméletből és a gyakorlatokból együtt.</span></div>
      <div class="row"><button class="primary" type="button" id="fQuiz" ${qs.length?'':'disabled'}>Kvíz (${Math.min(20,qs.length)} kérdés)</button><button type="button" id="fCards" ${cards.length?'':'disabled'}>Kártyák (${cards.length})</button></div></div>
    <div class="row lnav">${prev?`<button type="button" id="fPrev">← ${esc(prev.o.name)}</button>`:''}<span class="spacer"></span>${nxt?`<button type="button" id="fNext">${esc(nxt.o.name)} →</button>`:''}</div>
  </div>`;
  app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>openLesson(b.dataset.sec));
  app.querySelectorAll('[data-anim]').forEach(b=>b.onclick=()=>openOverlay(b.dataset.anim));

function bindExLinks(root){root.querySelectorAll('.exlink').forEach(b=>b.onclick=()=>openOverlay(b.dataset.ex))}
function openOverlay(id){const prevKey=window.EXPL.key;const ov=document.createElement('div');ov.className='overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="ovin"><button type="button" class="ovclose" aria-label="Bezárás">✕ Vissza a kérdéshez</button><div class="ovroot"></div></div>';document.body.appendChild(ov);document.body.classList.add('noscroll');
  const saved=session;session=null;window.EXPL.open(id,ov.querySelector('.ovroot'));
  const close=()=>{window.EXPL.key=prevKey;session=saved;ov.remove();document.body.classList.remove('noscroll');document.removeEventListener('keydown',esc_);const nb=document.getElementById('next');if(nb)nb.focus()};
  const esc_=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc_);
  ov.querySelector('.ovclose').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};ov.querySelector('.ovclose').focus()}
function answer(ix){
  const s=session;if(s.answered)return;s.answered=true;
  const q=s.items[s.i],o=s.opts[ix],ok=o.v===q.a;
  record(q.id,ok);if(ok)s.good++;else s.missed.push(q);
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;b.style.opacity=1;if(s.opts[j].v===q.a)b.classList.add('ok');else if(j===ix)b.classList.add('no')});
  const right=q.t==='tf'?(q.a?'Igaz':'Hamis'):q.o[q.a];
  document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Helyes.':'Nem jó. A helyes válasz: '+esc(right)}</b>${q.e?`<div class="fe">${esc(q.e)}</div>`:''}</div>
    ${q.megj?`<div class="megj"><b>A jegyzetben eltér:</b> ${esc(q.megj)}</div>`:''}${exLinks(q)}${srcLink(q)}`;
  bindExLinks(document.getElementById('fb'));
  const nb=document.getElementById('next');nb.disabled=false;nb.focus();
}
function next(){const s=session;if(s.i<s.items.length-1){s.i++;showQ()}else finish()}
function finish(){
  const s=session;const done=s.i+(s.answered?1:0);
  app.innerHTML=`<div class="panel"><h2>${esc(s.title)}: eredmény</h2>
    <div class="result">${s.good} / ${done}</div>
    <div class="sub">${done?Math.round(100*s.good/done):0}% helyes. Az elrontott kérdések a „Hibáim ismétlése” listába kerültek.</div>
    ${s.missed.length?`<div class="missed"><h3>Elrontott kérdések</h3>${s.missed.map(q=>`<div>${esc(q.q)}<br><b>${esc(q.t==='tf'?(q.a?'Igaz':'Hamis'):q.o[q.a])}</b></div>`).join('')}</div>`:''}
    <div class="actions">${s.missed.length?'<button class="primary" id="again" type="button">Elrontottak újra</button>':''}<button id="back" type="button">Vissza a főoldalra</button></div></div>`;
  const a=document.getElementById('again');if(a){const m=s.missed;a.onclick=()=>startQuiz(m,999,'Elrontottak újra')}
  document.getElementById('back').onclick=home;session=null;
}

/* ---- Vizsgaszimuláció: visszajelzés csak a végén ---- */
let examTimer=null;
function startExam(){
  const pool=ALL.filter(quizzable);const byc={};pool.forEach(q=>(byc[q.ch]=byc[q.ch]||[]).push(q));
  // arányos mintavétel fejezetenként, legalább 1 kérdés mindegyikből
  let items=[];const n=30;ORDER.forEach(c=>{const L=shuffle(byc[c]||[]);const k=Math.max(1,Math.round(n*L.length/pool.length));items=items.concat(L.slice(0,k))});
  if(items.length<n){const used=new Set(items.map(q=>q.id));items=items.concat(shuffle(pool.filter(q=>!used.has(q.id))).slice(0,n-items.length))}
  items=shuffle(items).slice(0,n);
  session={kind:'exam',title:'Vizsgaszimuláció',items,i:0,ans:items.map(()=>null),opts:items.map(q=>q.t==='tf'?[{l:'Igaz',v:true,k:'I'},{l:'Hamis',v:false,k:'H'}]:shuffle(q.o.map((l,ix)=>({l,v:ix}))).map((o,ix)=>({...o,k:String(ix+1)}))),end:Date.now()+30*60*1000};
  clearInterval(examTimer);examTimer=setInterval(()=>{const el=document.getElementById('timer');if(!session||session.kind!=='exam'){clearInterval(examTimer);return}const ms=session.end-Date.now();if(ms<=0){clearInterval(examTimer);examFinish();return}if(el){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',ms<5*60000)}},500);
  showExam();
}
function showExam(){
  const s=session,q=s.items[s.i],opts=s.opts[s.i],answered=s.ans.filter(a=>a!==null).length;
  app.innerHTML=`<div class="panel">
    ${qtop(kOf(q.ch),s.i+1,s.items.length,'Vizsgaszimuláció',`megválaszolva: ${answered} · <b class="timer" id="timer">30:00</b>`)}
    ${ruler(s.items.length,s.ans.map((a,k)=>a!==null?(k+0.5)/s.items.length:null).filter(x=>x!==null),answered/s.items.length,(s.i+0.5)/s.items.length)}
    ${q.out?`<pre class="out">${esc(q.out)}</pre>`:''}
    <div class="q">${esc(q.q)}</div>
    <div class="opts">${opts.map((o,ix)=>`<button class="opt ${s.ans[s.i]===ix?'sel':''}" type="button" data-ix="${ix}"><kbd>${o.k}</kbd><span>${esc(o.l)}</span></button>`).join('')}</div>
    <div class="row"><button type="button" id="eprev" ${s.i===0?'disabled':''}>◀ Előző</button><button type="button" id="enext" ${s.i===s.items.length-1?'disabled':''}>Következő ▶</button><span class="spacer"></span><button class="primary" type="button" id="efin">Beadás</button></div>
    <div class="hint">Itt nincs azonnali visszajelzés. A válaszaidat a beadásig módosíthatod.</div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>examPick(+b.dataset.ix));
  document.getElementById('eprev').onclick=()=>{s.i--;showExam()};
  document.getElementById('enext').onclick=()=>{s.i++;showExam()};
  document.getElementById('efin').onclick=()=>{const left=s.ans.filter(a=>a===null).length;if(left&&!s.confirm){s.confirm=true;document.querySelector('.hint').innerHTML=`<b>Még ${left} kérdés megválaszolatlan.</b> Kattints újra a Beadásra, ha így is beadod.`;return}examFinish()};
}
function examPick(ix){const s=session;s.ans[s.i]=ix;s.confirm=false;if(s.i<s.items.length-1){s.i++;}showExam()}
function examFinish(){
  clearInterval(examTimer);const s=session;let good=0;const per={};const missed=[];
  s.items.forEach((q,k)=>{const a=s.ans[k];const ok=a!==null&&s.opts[k][a].v===q.a;if(a!==null)record(q.id,ok);if(ok)good++;else missed.push(q);const p=per[q.ch]=per[q.ch]||[0,0];p[1]++;if(ok)p[0]++});
  const pct=Math.round(100*good/s.items.length);
  const grade=pct>=85?'jeles':pct>=70?'jó':pct>=55?'közepes':pct>=40?'elégséges':'elégtelen';
  app.innerHTML=`<div class="panel"><h2>Vizsgaszimuláció: eredmény</h2>
    <div class="result">${good} / ${s.items.length} · ${pct}%</div>
    <div class="sub">Tájékoztató érdemjegy egy szokásos 40/55/70/85%-os skálán: <b>${grade}</b>. A tárgy valódi ponthatárait az oktató adja meg.</div>
    <h3>Fejezetenként</h3><div class="bych">${Object.keys(per).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(c=>`<div><span>${esc(NAMES[c])}</span><b>${per[c][0]}/${per[c][1]}</b></div>`).join('')}</div>
    ${missed.length?`<div class="missed"><h3>Hibás vagy kihagyott kérdések</h3>${missed.map(q=>`<div>${esc(q.q)}<br><b>${esc(q.t==='tf'?(q.a?'Igaz':'Hamis'):q.o[q.a])}</b>${q.e?`<div class="sub">${esc(q.e)}</div>`:''}</div>`).join('')}</div>`:''}
    <div class="actions">${missed.length?'<button class="primary" id="again" type="button">Hibásak gyakorlása</button>':''}<button id="back" type="button">Vissza a főoldalra</button></div></div>`;
  const ag=document.getElementById('again');if(ag){const m=missed;ag.onclick=()=>startQuiz(m,999,'Vizsga hibái')}
  document.getElementById('back').onclick=home;session=null;window.scrollTo(0,0);
}
function startCards(pool){session={kind:'cards',items:pick(pool,pool.length),i:0,flipped:false,known:0};showCard()}
function showCard(){
  const s=session,q=s.items[s.i];s.flipped=false;
  app.innerHTML=`<div class="panel">
    ${qtop(kOf(q.ch),s.i+1,s.items.length,'Fogalomkártyák',`tudtam: ${s.known}`)}
    ${ruler(s.items.length,[],s.i/s.items.length,(s.i+0.5)/s.items.length)}
    <div class="card" id="card" tabindex="0" role="button" aria-label="Kártya megfordítása">
      <h2>${esc(q.q)}</h2>${q.out?`<pre class="out">${esc(q.out)}</pre>`:''}
      <div class="back" id="back" hidden>${esc(q.b)}${q.megj?`<div class="megj" style="margin-top:8px"><b>A jegyzetben eltér:</b> ${esc(q.megj)}</div>`:''}</div>
      <div class="hint" id="flipHint">Kattints vagy nyomd meg a szóközt a megfordításhoz.</div>
    </div>
    ${exLinks(q)}${srcLink(q)}
    <div class="row"><button type="button" id="quit">Befejezés</button><span class="spacer"></span>
      <button type="button" id="no" disabled>Nem tudtam</button><button class="primary" type="button" id="yes" disabled>Tudtam</button></div></div>`;
  const flip=()=>{if(s.flipped)return;s.flipped=true;document.getElementById('back').hidden=false;document.getElementById('flipHint').hidden=true;document.getElementById('yes').disabled=false;document.getElementById('no').disabled=false;document.getElementById('yes').focus()};
  s.flip=flip;bindExLinks(app);
  document.getElementById('card').onclick=flip;
  const go=ok=>{record(q.id,ok);if(ok)s.known++;if(s.i<s.items.length-1){s.i++;showCard()}else{app.innerHTML=`<div class="panel"><h2>Kártyák vége</h2><div class="result">${s.known} / ${s.items.length}</div><div class="actions"><button class="primary" id="back2" type="button">Vissza a főoldalra</button></div></div>`;document.getElementById('back2').onclick=home;session=null}};
  s.go=go;
  document.getElementById('yes').onclick=()=>go(true);
  document.getElementById('no').onclick=()=>go(false);
  document.getElementById('quit').onclick=home;
}
document.addEventListener('keydown',e=>{
  if(!session||e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key.toLowerCase();
  if(session.kind==='quiz'){
    if(!session.answered){const ix=session.opts.findIndex(o=>o.k.toLowerCase()===k);if(ix>=0){e.preventDefault();answer(ix)}}
    else if(k==='enter'&&e.target.id!=='next'&&e.target.id!=='quit'){e.preventDefault();next()}
  }else if(session.kind==='exam'){
    const ix=session.opts[session.i].findIndex(o=>o.k.toLowerCase()===k);if(ix>=0){e.preventDefault();examPick(ix)}
  }else if(session.kind==='cards'){
    if(k===' '&&!session.flipped){e.preventDefault();session.flip()}
    else if(session.flipped&&(k==='1'||k==='n')){session.go(false)}
    else if(session.flipped&&(k==='2'||k==='t')){session.go(true)}
  }
});
document.getElementById('navLearn').onclick=learnHome;
document.getElementById('navBank').onclick=home;
route();
window.addEventListener('hashchange',route);
})();
</script>
